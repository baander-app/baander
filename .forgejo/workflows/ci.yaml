name: CI

on:
    push:
        branches:
            - master
    pull_request:
        types: [ opened, synchronize, reopened ]

env:
    REGISTRY: ${{ vars.REGISTRY_URL }}
    IMAGE_NAME: ${{ vars.REGISTRY_OWNER }}/baander
    POSTGRES_IMAGE: ${{ vars.REGISTRY_OWNER }}/baander-postgres
    COVERAGE_PACKAGE: coverage-backend
    BUILDKIT_CACHE_PACKAGE: buildkit-cache-backend
    CI_IMAGE: baander-ci:${{ forgejo.run_id }}-${{ forgejo.run_attempt }}

jobs:
    quality-gate:
        runs-on: docker-cli
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"

            -   name: Login to Container Registry
                run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ forgejo.actor }} --password-stdin

            -   name: Pull PostgreSQL image
                run: docker pull ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE }}:latest

            -   name: Restore BuildKit cache
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    API="$GITHUB_API_URL"
                    OWNER="${GITHUB_REPOSITORY%%/*}"
                    HTTP=$(curl -sf -o buildkit-cache.tar.zst -w '%{http_code}' \
                      "$API/packages/$OWNER/generic/$BUILDKIT_CACHE_PACKAGE/latest/buildkit-cache.tar.zst" \
                      -H "Authorization: token $FORGEJO_TOKEN" 2>/dev/null || echo '000')
                    if [ "$HTTP" = "200" ]; then
                      mkdir -p /tmp/buildkit-cache
                      tar -xf buildkit-cache.tar.zst -C /tmp/buildkit-cache || true
                      rm -f buildkit-cache.tar.zst
                      echo "Restored BuildKit cache"
                    else
                      rm -f buildkit-cache.tar.zst
                      mkdir -p /tmp/buildkit-cache
                      echo "No BuildKit cache found, starting fresh"
                    fi

            -   name: Docker build context contract
                run: bash scripts/test-docker-context.sh

            -   name: Build CI image
                run: |
                    docker buildx build \
                      --target ci \
                      -t "$CI_IMAGE" \
                      --load \
                      --cache-to=type=local,dest=/tmp/buildkit-cache,mode=max \
                      --cache-from=type=local,src=/tmp/buildkit-cache \
                      .

            -   name: Xdebug runtime contract
                run: BAANDER_TEST_IMAGE="$CI_IMAGE" bash scripts/test-dev-xdebug-container.sh

            -   name: Build production worker image
                run: |
                    docker buildx build --target worker --load \
                      --build-arg BAANDER_SOURCE_REVISION="${{ forgejo.sha }}" \
                      -t "${CI_IMAGE}-worker" \
                      --cache-from=type=local,src=/tmp/buildkit-cache .

            -   name: Collect and verify worker packaged inventory
                run: |
                    bash scripts/collect-packaged-inventory.sh \
                      --image "${CI_IMAGE}-worker" --target worker \
                      --revision "${{ forgejo.sha }}" \
                      --output var/test-runs/application-inventory-worker

            -   name: Production worker lifecycle and dependencies
                run: |
                    BAANDER_TEST_IMAGE="${CI_IMAGE}-worker" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                      bash scripts/test-worker-production-container.sh

            -   name: Independent web and worker media ownership
                run: |
                    BAANDER_TEST_IMAGE="${CI_IMAGE}-worker" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                      bash scripts/test-two-command-deployment-container.sh

            -   name: Composer platform requirements
                run: docker run --rm "$CI_IMAGE" composer check-platform-reqs

            -   name: PHPStan
                run: |
                    docker run --rm -e XDEBUG_MODE=off \
                      "$CI_IMAGE" \
                      php ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            -   name: OpenAPI drift
                run: |
                    docker run --rm "$CI_IMAGE" \
                      php bin/console app:export-openapi-spec --env=test --no-debug --check

            -   name: Deptrac
                run: |
                    docker run --rm "$CI_IMAGE" vendor/bin/deptrac analyse --no-cache --no-progress

            -   name: Docker Compose availability
                run: docker compose version

            -   name: Backend runner regressions
                run: |
                    python3 -m unittest discover -s scripts/tests
                    docker run --rm --network none --entrypoint python3 "$CI_IMAGE" \
                      -m unittest discover -s scripts/tests -p test_retain_build_evidence.py
                    bash scripts/test-worker-operator-cleanup.sh

            -   name: Backend stack isolation
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                      python3 scripts/test-backend-stack-isolation.py --artifacts var/test-isolation

            -   name: PHPUnit with coverage
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      bash scripts/test-backend-container.sh \
                      --coverage-text=coverage/report.txt --coverage-clover=coverage/clover.xml

            -   name: Messenger without Swoole
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                    BAANDER_TEST_DISABLE_SWOOLE=1 \
                      bash scripts/test-backend-container.sh \
                      tests/Fixtures/MessengerWithoutSwooleTest.php \
                      tests/Unit/Shared/Infrastructure/Messenger/SwooleFallbackHandlerRegistrationTest.php \
                      tests/Integration/MessengerJsonDeliveryTest.php \
                      tests/Integration/MessengerAdmissionLifecycleTest.php

            -   name: Container startup contract
                run: bash scripts/test-container-startup.sh

            -   name: Legacy transport redelivery recovery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 300 bash scripts/test-worker-runtime-container.sh

            -   name: Worker command lifecycle and delivery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      bash scripts/test-worker-command-container.sh

            -   name: Worker deployment operator lifecycle
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                    BAANDER_TEST_OPERATOR_IN_CONTAINER=1 \
                      bash scripts/test-worker-operator-container.sh

            -   name: Standalone worker dependency outages and recovery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                    BAANDER_TEST_OPERATOR_IN_CONTAINER=1 \
                      bash scripts/test-worker-lifecycle-container.sh

            -   name: Outbox notification replay
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 180 bash scripts/test-outbox-runtime-container.sh

            -   name: Producer transaction rollback and recovery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 180 bash scripts/test-producer-runtime-container.sh

            -   name: Web server mail language, audio streaming and health alerts
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 180 bash scripts/test-web-runtime-container.sh

            -   name: Application security runtime boundaries
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      bash scripts/test-security-runtime-container.sh

            -   name: WebSocket proxy credential logging
                run: |
                    docker build -f docker/nginx/Dockerfile.test -t "${CI_IMAGE}-proxy" docker/nginx
                    BAANDER_TEST_PROXY_IMAGE="${CI_IMAGE}-proxy" bash scripts/test-websocket-proxy-logs.sh

            -   name: Web server drain on stop (PID 1)
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 900 bash scripts/test-web-shutdown-container.sh

            -   name: Extract coverage metrics
                run: python3 scripts/validate-backend-coverage.py coverage

            -   name: Preserve backend verification artifacts
                if: always()
                uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
                with:
                    name: backend-verification
                    path: |
                        var/test-runs/
                        var/test-isolation/
                        coverage/
                    if-no-files-found: ignore
                    retention-days: 14

            -   name: Store baseline (master only)
                if: forgejo.ref == 'refs/heads/master'
                continue-on-error: true
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    API="$GITHUB_API_URL"
                    OWNER="${GITHUB_REPOSITORY%%/*}"
                    if [ ! -f coverage/metrics.json ]; then
                      echo "⚠️ coverage/metrics.json not found — skipping baseline upload"
                      exit 0
                    fi
                    curl -sf -o /dev/null -X DELETE \
                      "$API/packages/$OWNER/generic/$COVERAGE_PACKAGE/latest/metrics.json" \
                      -H "Authorization: token $FORGEJO_TOKEN" || true
                    HTTP=$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
                      "$API/packages/$OWNER/generic/$COVERAGE_PACKAGE/latest/metrics.json" \
                      -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/json" \
                      --data-binary @coverage/metrics.json)
                    if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
                      echo "Stored backend baseline (HTTP $HTTP)"
                    else
                      echo "⚠️ Failed to store baseline (HTTP $HTTP)"
                    fi

            -   name: Save BuildKit cache (master only)
                if: forgejo.ref == 'refs/heads/master'
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    API="$GITHUB_API_URL"
                    OWNER="${GITHUB_REPOSITORY%%/*}"

                    tar -cf - -C / tmp/buildkit-cache | zstd -o buildkit-cache.tar.zst

                    curl -sf -o /dev/null -X DELETE \
                      "$API/packages/$OWNER/generic/$BUILDKIT_CACHE_PACKAGE/latest/buildkit-cache.tar.zst" \
                      -H "Authorization: token $FORGEJO_TOKEN" || true

                    HTTP=$(curl -sf -o /dev/null -w '%{http_code}' -X PUT \
                      "$API/packages/$OWNER/generic/$BUILDKIT_CACHE_PACKAGE/latest/buildkit-cache.tar.zst" \
                      -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/zstd" \
                      --data-binary @buildkit-cache.tar.zst)
                    echo "Stored BuildKit cache (HTTP $HTTP)"

            -   name: Post coverage comment (PR only)
                if: forgejo.event_name == 'pull_request'
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PR_NUMBER: ${{ forgejo.event.number }}
                run: |
                    API="$GITHUB_API_URL"
                    OWNER="${GITHUB_REPOSITORY%%/*}"

                    MASTER_JSON=$(curl -sf \
                      "$API/packages/$OWNER/generic/$COVERAGE_PACKAGE/latest/metrics.json" \
                      -H "Authorization: token $FORGEJO_TOKEN" 2>/dev/null || echo '{}')

                    COMMENT=$(node -e "
                      const cur = require('./coverage/metrics.json');
                      const mas = $MASTER_JSON;

                      function delta(k) {
                        if (mas[k] === undefined) return '';
                        const d = cur[k] - mas[k];
                        const s = d >= 0 ? '+' : '';
                        const i = d > 0 ? '🟢' : d < 0 ? '🔴' : '⚪';
                        return ' | ' + i + ' ' + s + d.toFixed(1) + '%';
                      }

                      let c = '## 📊 Backend Coverage\n\n';
                      c += '| Metric | Coverage | Baseline | Change |\n';
                      c += '|--------|----------|----------|--------|\n';
                      for (const k of ['lines','methods','classes']) {
                        const l = k[0].toUpperCase() + k.slice(1);
                        const b = mas[k] !== undefined ? mas[k].toFixed(1) + '%' : '—';
                        c += '| ' + l + ' | **' + cur[k].toFixed(1) + '%** | ' + b + delta(k) + ' |\n';
                      }
                      process.stdout.write(c);
                    ")

                    ESCAPED=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$COMMENT")
                    HTTP=$(curl -sf -o /dev/null -w '%{http_code}' -X POST \
                      "$API/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                      -H "Authorization: token $FORGEJO_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"body\": $ESCAPED}")
                    echo "Posted backend coverage comment (HTTP $HTTP)"

            -   name: Cleanup images
                if: always()
                run: |
                    docker image rm "$CI_IMAGE" "${CI_IMAGE}-worker" 2>/dev/null || true

    frontend-quality:
        runs-on: docker-cli
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Shared checks
                working-directory: ui/shared
                run: |
                    yarn install --immutable
                    yarn typecheck
                    yarn test
            -   name: Embedded player checks
                working-directory: ui/web/packages/baander-player
                run: |
                    corepack yarn install --immutable
                    corepack yarn typecheck
                    corepack yarn test
            -   name: Web checks
                working-directory: ui/web
                run: |
                    yarn install --immutable
                    yarn generate:check
                    yarn lint
                    yarn test
                    yarn build
                    node scripts/verify-build.mjs
            -   name: Install browser test runtime
                working-directory: ui/web
                run: yarn exec playwright install --with-deps chromium firefox webkit
            -   name: Native browser authentication transport
                working-directory: ui/web
                run: yarn test:browser-auth
            -   name: Native browser audio graph
                working-directory: ui/web
                run: yarn test:audio-graph
            -   name: Store isolation and debugger browser workflow
                working-directory: ui/web
                run: yarn test:store-debug

    dsp-quality:
        runs-on: docker-cli
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Install pinned Emscripten
                run: |
                    git init -q /tmp/baander-dsp-emsdk
                    git -C /tmp/baander-dsp-emsdk remote add origin https://github.com/emscripten-core/emsdk.git
                    git -C /tmp/baander-dsp-emsdk fetch -q --depth 1 origin db04e88298d9916fc51fcd3743045ca3eb695127
                    git -C /tmp/baander-dsp-emsdk checkout -q --detach FETCH_HEAD
                    /tmp/baander-dsp-emsdk/emsdk install 6.0.3
                    /tmp/baander-dsp-emsdk/emsdk activate 6.0.3
            -   name: Build and qualify analysis modules
                run: |
                    . /tmp/baander-dsp-emsdk/emsdk_env.sh
                    bash scripts/test-dsp-analysis.sh

    registry-quality:
        runs-on: docker-cli
        timeout-minutes: 30
        strategy:
            matrix:
                mode: [ release, sanitize ]
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
            options: --tmpfs /run/baander-registry-full-disk:rw,noexec,nosuid,nodev,size=128m,mode=0700
        env:
            REGISTRY_FULL_DISK_ROOT: /run/baander-registry-full-disk
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Install native test tools
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends ninja-build openssl
            -   name: Build and qualify registry
                run: bash scripts/test-registry.sh ${{ matrix.mode }}

    registry-static-quality:
        runs-on: docker-cli
        timeout-minutes: 30
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Install static analysis toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends clang-19 clang-tidy-19 ninja-build python3 python3-yaml
            -   name: Analyze registry and verify direct dependency licenses
                run: bash scripts/test-registry-static.sh

    registry-container-quality:
        runs-on: docker-cli
        timeout-minutes: 30
        env:
            REGISTRY_INVENTORY_OUTPUT: var/test-runs/registry-inventory
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Install container test tools
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends python3 openssl
            -   name: Build and qualify registry containers
                run: bash scripts/test-registry-container.sh
            -   name: Qualify encrypted registry backup and recovery
                run: bash scripts/test-registry-backup.sh
            -   name: Preserve packaged Registry inventories
                if: always()
                uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
                with:
                    name: registry-packaged-inventory
                    path: var/test-runs/registry-inventory/
                    if-no-files-found: error
                    retention-days: 14

    registry-thread-quality:
        runs-on: docker-cli
        timeout-minutes: 30
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Install thread sanitizer toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends python3 openssl clang-19 libclang-rt-19-dev ninja-build
            -   name: Build and qualify registry threads
                env:
                    CC: clang-19
                    CXX: clang++-19
                run: bash scripts/test-registry.sh thread

    registry-fuzz-quality:
        runs-on: docker-cli
        timeout-minutes: 45
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"
            -   name: Install parser fuzz toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends python3 openssl clang-19 libclang-rt-19-dev ninja-build
            -   name: Fuzz registry parser and registration validation
                env:
                    CC: clang-19
                    CXX: clang++-19
                run: bash scripts/test-registry.sh fuzz

    build-and-push:
        runs-on: docker-cli
        needs: [ quality-gate, frontend-quality, dsp-quality, registry-quality, registry-container-quality, registry-thread-quality, registry-fuzz-quality, registry-static-quality ]
        container:
            image: ${{ vars.REGISTRY_URL }}/${{ vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                run: |
                    git init -q
                    git remote add origin ${{ forgejo.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: token ${{ secrets.GITHUB_TOKEN }}" fetch -q origin "${{ forgejo.sha }}"
                    git checkout -q --detach "${{ forgejo.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ forgejo.sha }}"

            -   name: Login to Container Registry
                run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ forgejo.actor }} --password-stdin

            -   name: Build production image
                run: |
                    docker buildx build \
                      --target production \
                      --build-arg BAANDER_SOURCE_REVISION="${{ forgejo.sha }}" \
                      --tag "$REGISTRY/$IMAGE_NAME:${{ forgejo.sha }}" \
                      --tag "$REGISTRY/$IMAGE_NAME:latest" \
                      --load \
                      .

            -   name: Collect and verify production packaged inventory
                run: |
                    bash scripts/collect-packaged-inventory.sh \
                      --image "$REGISTRY/$IMAGE_NAME:${{ forgejo.sha }}" --target production \
                      --revision "${{ forgejo.sha }}" \
                      --output var/test-runs/application-inventory-production

            -   name: Push verified production image
                if: forgejo.ref == 'refs/heads/master'
                run: |
                    OUTPUT=var/test-runs/application-inventory-production
                    docker push "$REGISTRY/$IMAGE_NAME:${{ forgejo.sha }}" > "$OUTPUT/push-revision.log" 2>&1
                    cat "$OUTPUT/push-revision.log"
                    docker image inspect "$REGISTRY/$IMAGE_NAME:${{ forgejo.sha }}" > "$OUTPUT/published-image-inspect.json"
                    docker push "$REGISTRY/$IMAGE_NAME:latest" > "$OUTPUT/push-latest.log" 2>&1
                    cat "$OUTPUT/push-latest.log"

            -   name: Preserve production packaged inventory
                if: always()
                uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
                with:
                    name: application-packaged-inventory-production
                    path: var/test-runs/application-inventory-production/
                    if-no-files-found: ignore
                    retention-days: 14
