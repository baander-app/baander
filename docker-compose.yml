# The database image also runs the connection pooler and prepares its credentials.
x-database-build: &database-build
    context: ./docker/
    dockerfile: ./postgres/Dockerfile
    args:
        PGROONGA_VERSION: 4.0.5-1
        POSTGRESQL_VERSION: 18

services:
    nginx:
        image: martinjuul/baander-nginx:latest
        container_name: baander-nginx
        build:
            context: ./docker/
            args:
                BUILD_ARGUMENT_ENV: dev
            dockerfile: ./nginx/Dockerfile
        restart: unless-stopped
        ports:
            - "${WEB_PORT_HTTP:-80}:80"
            - "${WEB_PORT_TLS:-443}:443"
        networks:
            - baander-backtier
        environment:
            SERVER_NAME: ${SERVER_NAME:-baander.test}
        volumes:
            - ./:${APP_HOME:?Use the generated build --compose-env file}:ro,cached
        depends_on:
            - app

    app:
        image: ${BAANDER_APPLICATION_IMAGE:?Build with php scripts/build-application.php --target dev --tag baander:local --compose-env .env.compose.local and pass --env-file .env.compose.local}
        privileged: true
        container_name: baander-app
        # The web server drains within WEB_DRAIN_SECONDS (default 30); Docker must wait a
        # little longer before it sends SIGKILL.
        stop_grace_period: 35s
        ulimits:
            nofile:
                soft: 10000
                hard: 10000
            memlock:
                soft: -1
                hard: -1
        cap_add:
            - SYS_NICE
            - IPC_LOCK
        # NVIDIA GPU passthrough for NVENC/NVDEC hardware transcoding
        # Requires: NVIDIA Container Toolkit (nvidia-container-toolkit) installed on host
        #        deploy:
        #            resources:
        #                reservations:
        #                    devices:
        #                        - driver: nvidia
        #                          count: all
        #                          capabilities: [gpu]
        # Intel iGPU passthrough for QSV/VAAPI hardware transcoding
        #        devices:
        #            - /dev/dri:/dev/dri
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - "41234:41234/udp"
            - "127.0.0.1:9501:9501"
        volumes:
            - /home/martin/dev/baander-musik:/home/martin/dev/baander-musik:ro
            - ./:${APP_HOME:?Use the generated build --compose-env file}:cached
            - ./docker/dev/php.ini:/usr/local/etc/php/php.ini:ro
            - ./docker/dev/swoole.ini:/usr/local/etc/php/conf.d/docker-php-ext-swoole.ini:ro
            - /home/martin/Music:/home/martin/Music
            - /home/martin/Videos:/home/martin/Videos:ro
        healthcheck:
            test: [ "CMD", "php", "bin/console", "app:health:check" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s
        networks:
            - baander-backtier

    database:
        container_name: baander-postgres
        image: baander-database:latest
        build: *database-build
        restart: unless-stopped
        networks:
            - baander-backtier
        ports:
            - "5432:5432"
        shm_size: 256mb
        environment:
            POSTGRES_USER: ${DB_USERNAME:-baander}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-baander}
            POSTGRES_DB: ${DB_DATABASE:-baander}
            PGDATA: /var/lib/postgresql/data/baanderdev
        volumes:
            - postgres_data:/var/lib/postgresql/data
        command: >
            postgres
            -c logging_collector=on
            -c log_directory=/var/log/postgresql
            -c log_filename=postgresql-%Y-%m-%d_%H%M%S.log
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-baander} -d ${DB_DATABASE:-baander}" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    # Gives the database roles and the pooler's auth file one SCRAM verifier each, over
    # the direct connection, before the pooler starts.
    pooler-credentials:
        image: baander-database:latest
        build: *database-build
        restart: "no"
        networks:
            - baander-backtier
        environment:
            PGPASSWORD: ${DB_PASSWORD:-baander}
            BAANDER_POOLER_USER: ${DB_USERNAME:-baander}
            BAANDER_POOLER_DATABASE: ${DB_DATABASE:-baander}
            BAANDER_POOLER_SERVER_HOST: database
        entrypoint: [ "baander-pooler-credentials" ]
        command: [ "/credentials" ]
        volumes:
            - pooler_credentials:/credentials
        tmpfs:
            - /var/lib/postgresql
        depends_on:
            database:
                condition: service_healthy

    # Transaction-mode PgBouncer: DATABASE_URL uses its application alias and
    # DATABASE_CONTROL_URL its control alias and role.
    pooler:
        container_name: baander-pooler
        image: baander-database:latest
        build: *database-build
        restart: unless-stopped
        user: postgres
        entrypoint: [ "baander-pooler" ]
        networks:
            - baander-backtier
        environment:
            BAANDER_POOLER_USER: ${DB_USERNAME:-baander}
            BAANDER_POOLER_DATABASE: ${DB_DATABASE:-baander}
            BAANDER_POOLER_SERVER_HOST: database
            BAANDER_POOLER_APPLICATION_POOL_SIZE: 20
            BAANDER_POOLER_CONTROL_POOL_SIZE: 8
        volumes:
            - pooler_credentials:/etc/baander-pooler/credentials:ro
        tmpfs:
            - /var/lib/postgresql
        depends_on:
            pooler-credentials:
                condition: service_completed_successfully
        healthcheck:
            test: [ "CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432" ]
            interval: 5s
            timeout: 5s
            retries: 24

    redis:
        image: redis/redis-stack-server:edge
        container_name: baander-redis
        restart: unless-stopped
        # noeviction is required by RedisTagAwareAdapter (tag-aware cache pool).
        # Do not change to allkeys-lru or Redis tag invalidation will silently stop working.
        command: redis-server --maxmemory-policy noeviction --requirepass $REDIS_PASSWORD
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        networks:
            - baander-backtier
        ports:
            - "127.0.0.1:6379:6379"

    profiler:
        image: reliforp/reli-prof
        container_name: baander-profiler
        entrypoint: [ "sleep", "infinity" ]
        pid: host
        security_opt:
            - apparmor:unconfined
        cap_add:
            - SYS_PTRACE
        stdin_open: true
        tty: true
        volumes:
            - ./:${APP_HOME:?Use the generated build --compose-env file}:cached
        working_dir: ${APP_HOME:?Use the generated build --compose-env file}
        networks:
            - baander-backtier
        profiles:
            - profiling

volumes:
    postgres_data:
    pooler_credentials:

    ###> doctrine/doctrine-bundle ###
    database_data:
        ###< doctrine/doctrine-bundle ###
        driver: local

networks:
    baander-backtier:
        name: baander-backtier
        external: true
