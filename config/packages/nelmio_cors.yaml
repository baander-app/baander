nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin: []
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'DPoP', 'X-Requested-With', 'X-Baander-Device-Id', 'X-Baander-Client-Fingerprint', 'X-Baander-Correlation-ID', 'Accept', 'Origin']
        expose_headers: ['Link', 'DPoP-Nonce']
        max_age: 3600
    paths:
        # The authorization endpoint must not answer cross-origin requests (RFC 9700 section 2.6).
        # AuthorizationCorsOptionsProvider enforces this before routing, for encoded and
        # trailing-slash variants of the path too.

        # OAuth token endpoint and device authorization: called by third-party and device
        # clients from any origin. Requests carry a DPoP proof, not cookies.
        '^/api/oauth/(token|device/authorize)$':
            allow_origin: ['*']
            allow_headers: ['Content-Type', 'DPoP', 'X-Requested-With', 'X-Baander-Client-Fingerprint', 'X-Baander-Correlation-ID', 'Accept', 'Origin']
            allow_methods: ['OPTIONS', 'POST']
            expose_headers: ['DPoP-Nonce']
            max_age: 3600

        # Authorization server metadata (RFC 8414) and JWKS: public, allow all origins
        '^/\.well-known/':
            allow_origin: ['*']
            allow_methods: ['GET', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization', 'DPoP', 'X-Requested-With', 'X-Baander-Correlation-ID', 'Accept', 'Origin']
            expose_headers: ['DPoP-Nonce']
            max_age: 3600

        # Discovery CORS policy; endpoint authentication still applies
        '^/api/discovery/':
            allow_origin: ['*']
            allow_methods: ['GET', 'OPTIONS', 'POST']
            allow_headers: ['Content-Type', 'X-Requested-With', 'X-Baander-Correlation-ID', 'Accept', 'Origin']
            expose_headers: ['Link']
            max_age: 3600

        # Favorites endpoints: restricted (requires auth)
        '^/api/favorites':
            allow_origin: ['%env(APP_URL)%']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'DELETE']
            allow_headers: ['Content-Type', 'Authorization', 'DPoP', 'X-Requested-With', 'X-Baander-Client-Fingerprint', 'X-Baander-Correlation-ID', 'Accept', 'Origin']
            expose_headers: ['Link', 'DPoP-Nonce']
            max_age: 3600

        # Native media uses proof headers and byte-range requests.
        '^/api/(images/|stream/track$)':
            allow_origin: ['%env(APP_URL)%']
            allow_methods: ['GET', 'HEAD', 'OPTIONS']
            allow_headers: ['Content-Type', 'Authorization', 'DPoP', 'X-Requested-With', 'X-Baander-Client-Fingerprint', 'X-Baander-Correlation-ID', 'Accept', 'Origin', 'Range', 'If-Range']
            expose_headers: ['Link', 'DPoP-Nonce', 'Content-Range', 'Accept-Ranges', 'ETag', 'Last-Modified']

        # Catch-all for all other API routes (SPA, auth, OAuth token revocation, device approval, etc.)
        '^/api/':
            allow_origin: ['%env(APP_URL)%']
            allow_headers: ['Content-Type', 'Authorization', 'DPoP', 'X-Requested-With', 'X-Baander-Device-Id', 'X-Baander-Client-Fingerprint', 'X-Baander-Correlation-ID', 'Accept', 'Origin']
            allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
            expose_headers: ['Link', 'DPoP-Nonce']
            max_age: 3600
