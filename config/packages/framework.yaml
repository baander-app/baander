# see https://symfony.com/doc/current/reference/configuration/framework.html
parameters:
    # Shown by the admin panel and app:rate-limiter:list next to each limiter
    # configured under framework.rate_limiter below.
    app.rate_limiter.descriptions:
        anonymous_api: 'Unauthenticated /api requests per client IP'
        authenticated_api: 'Authenticated /api requests per user'
        auth_login_ip: 'Login attempts per IP (brute-force protection)'
        auth_login_ip_email: 'Login attempts per IP+email (distributed brute-force protection)'
        auth_register_ip: 'Registration attempts per IP'
        auth_password_reset_ip: 'Password reset requests and redemptions per IP'
        auth_password_reset_email: 'Password reset requests per account (normalized email)'
        auth_refresh_client: 'Token refresh per client'
        auth_passkey_ip: 'Passkey sign-in requests per IP'
        config_check: 'Admin configuration check'
        batch_cover_extract: 'Album cover batch extraction'
        discovery_endpoint_ip: 'Discovery registration and pairing requests per IP'

framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    handle_all_throwables: true

    # Trust X-Forwarded-* headers from nginx
    trusted_proxies: '172.18.0.0/16'  # Docker network
    trusted_headers: [X-Forwarded-For, X-Forwarded-Host, X-Forwarded-Proto, X-Forwarded-Port]

    # PHP session configuration
    session:
        handler_id: session.handler.redis
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    # CSRF protection
    csrf_protection: true

    # PHP serializer
    php_errors:
        log: true

    router:
        utf8: true

    assets:
        version_strategy: 'Pentatrion\ViteBundle\Asset\ViteAssetVersionStrategy'

    # Rate limiting. Each limiter has its own Redis-backed pool (config/packages/cache.yaml)
    # so the admin panel and app:rate-limiter:clear can reset one limiter without the others.
    rate_limiter:
        # Generic /api limiters, enforced by App\Auth\Infrastructure\Security\ApiRateLimitListener.
        anonymous_api:
            policy: sliding_window
            limit: '%auth.rate_limit.anonymous_api.max_requests%'
            interval: '%auth.rate_limit.anonymous_api.window% seconds'
            cache_pool: cache.rate_limiter.anonymous_api
        authenticated_api:
            policy: sliding_window
            limit: '%auth.rate_limit.authenticated_api.max_requests%'
            interval: '%auth.rate_limit.authenticated_api.window% seconds'
            cache_pool: cache.rate_limiter.authenticated_api

        # Auth endpoint-specific rate limiters (brute-force protection)
        auth_login_ip:
            policy: fixed_window
            limit: '%auth.rate_limit.login.max_attempts%'
            interval: '%auth.rate_limit.login.window% seconds'
            cache_pool: cache.rate_limiter.auth_login_ip
        auth_login_ip_email:
            policy: fixed_window
            limit: '%auth.rate_limit.login_per_email.max_attempts%'
            interval: '%auth.rate_limit.login.window% seconds'
            cache_pool: cache.rate_limiter.auth_login_ip_email
        auth_register_ip:
            policy: fixed_window
            limit: '%auth.rate_limit.register.max_attempts%'
            interval: '%auth.rate_limit.register.window% seconds'
            cache_pool: cache.rate_limiter.auth_register_ip
        auth_password_reset_ip:
            policy: fixed_window
            limit: '%auth.rate_limit.password_reset.max_attempts%'
            interval: '%auth.rate_limit.password_reset.window% seconds'
            cache_pool: cache.rate_limiter.auth_password_reset_ip
        auth_password_reset_email:
            policy: fixed_window
            limit: '%auth.rate_limit.password_reset_per_email.max_attempts%'
            interval: '%auth.rate_limit.password_reset.window% seconds'
            cache_pool: cache.rate_limiter.auth_password_reset_email
        auth_refresh_client:
            policy: fixed_window
            limit: '%auth.rate_limit.refresh.max_attempts%'
            interval: '%auth.rate_limit.refresh.window% seconds'
            cache_pool: cache.rate_limiter.auth_refresh_client
        auth_passkey_ip:
            policy: fixed_window
            limit: '%auth.rate_limit.passkey.max_attempts%'
            interval: '%auth.rate_limit.passkey.window% seconds'
            cache_pool: cache.rate_limiter.auth_passkey_ip

        # Admin endpoint-specific rate limiters
        config_check:
            policy: fixed_window
            limit: 10
            interval: '60 seconds'
            cache_pool: cache.rate_limiter.config_check
        batch_cover_extract:
            policy: sliding_window
            limit: 10
            interval: '60 seconds'
            cache_pool: cache.rate_limiter.batch_cover_extract

        # Discovery endpoint rate limiter (public registration/pairing endpoints)
        discovery_endpoint_ip:
            policy: fixed_window
            limit: 30
            interval: '60 seconds'
            cache_pool: cache.rate_limiter.discovery_endpoint_ip

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        rate_limiter:
            anonymous_api:
                limit: 10000
            authenticated_api:
                limit: 10000
            auth_login_ip:
                limit: 10000
            auth_login_ip_email:
                limit: 10000
            auth_register_ip:
                limit: 10000
            auth_password_reset_ip:
                limit: 10000
            auth_password_reset_email:
                limit: 10000
            auth_refresh_client:
                limit: 10000
            auth_passkey_ip:
                limit: 10000
            batch_cover_extract:
                limit: 10000
            config_check:
                limit: 10000
            discovery_endpoint_ip:
                limit: 10000
