parameters:
    # Defaults match docs-book/part-1-operator-guide/configuration.md.
    env(MAIL_FROM_ADDRESS): 'noreply@localhost'

framework:
    mailer:
        dsn: '%env(MAILER_DSN)%'
        # Applied to every message that does not set its own From header.
        headers:
            From: '%app.name% <%env(MAIL_FROM_ADDRESS)%>'

when@test:
    framework:
        mailer:
            # Nothing leaves the test process; the message logger still records each email.
            dsn: 'null://null'
