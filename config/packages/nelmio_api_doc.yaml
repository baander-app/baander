nelmio_api_doc:
    use_validation_groups: true
    documentation:
        info:
            title: Bånder API
            description: Self-hosted media server API
            version: 2.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: 'DPoP-bound access token (JWT), sent as `Authorization: DPoP <token>` with a DPoP proof. First-party apps obtain it via `/api/auth/login`, `/api/auth/login/passkey` or `/api/auth/refresh`; other clients via `/api/oauth/token`.'
                oauth2AuthCode:
                    type: oauth2
                    description: 'OAuth 2.0 authorization code flow with mandatory S256 PKCE. Token requests need a nonce-bearing DPoP proof, and the issued tokens are DPoP-bound.'
                    flows:
                        authorizationCode:
                            authorizationUrl: /api/oauth/authorize
                            tokenUrl: /api/oauth/token
                            refreshUrl: /api/oauth/token
                            scopes:
                                profile: 'Read the profile'
                                email: 'Read the email address'
                                library: 'Use the music library'
                                playlist: 'Manage playlists'
            parameters:
                Accept-Language:
                    name: Accept-Language
                    in: header
                    description: 'Locale for response messages. Supported: `en` (default), `da`.'
                    required: false
                    schema:
                        type: string
                        default: en
                        enum: [en, da]
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)
