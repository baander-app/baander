nelmio_api_doc:
    use_validation_groups: true
    documentation:
        info:
            title: Bånder API
            description: Self-hosted media server API
            version: 2.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
                    description: 'DPoP-bound access token (JWT), sent as `Authorization: DPoP <token>` with a DPoP proof. Obtain via `/api/auth/login`, `/api/auth/login/passkey` or `/api/auth/refresh`.'
            parameters:
                Accept-Language:
                    name: Accept-Language
                    in: header
                    description: 'Locale for response messages. Supported: `en` (default), `da`.'
                    required: false
                    schema:
                        type: string
                        default: en
                        enum: [en, da]
        security:
            - bearerAuth: []
    areas:
        path_patterns:
            - ^/api(?!/doc$)
