# OpenTelemetry. Every HTTP request records one server span in the diagnostics
# buffer (/api/debug/spans, app:server:spans) whether or not export is enabled.
# OTEL_ENABLED=true additionally exports spans to OTEL_EXPORTER_OTLP_ENDPOINT, the
# full OTLP/HTTP traces URL such as http://collector:4318/v1/traces.
# The services are wired in config/services.yaml.

parameters:
    env(OTEL_ENABLED): 'false'
    env(OTEL_EXPORTER_OTLP_ENDPOINT): ''
    env(OTEL_SERVICE_NAME): baander
    app.otel.enabled: '%env(bool:OTEL_ENABLED)%'
    app.otel.exporter_url: '%env(OTEL_EXPORTER_OTLP_ENDPOINT)%'
    app.otel.service_name: '%env(OTEL_SERVICE_NAME)%'

when@test:
    parameters:
        # Tests never export to a collector.
        app.otel.enabled: false
