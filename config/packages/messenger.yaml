parameters:
    # Shared by the failure transport options and FailureTransportAdministration.
    app.messenger.failure_table: failed_messages
    app.messenger.failure_queue: failed

framework:
    messenger:
        serializer:
            default_serializer: App\Shared\Infrastructure\Messenger\JsonTransportSerializer
        transports:
            # Swoole task workers — primary async transport
            swoole_task:
                dsn: 'swoole://task'

            # Redis transport — durable async routes and Swoole fallback
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    stream: messages
                    group: baander
                    consumer: '%env(MESSENGER_CONSUMER_NAME)%'
                    delete_after_ack: true
                    # MAXLEN trims unread and pending deliveries indiscriminately.
                    # Retain accepted entries until acknowledgement; admission and
                    # Redis noeviction must reject new work under resource pressure.
                    stream_max_entries: 0
                    redeliver_timeout: 3600
                    claim_interval: 60000
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            # Occurrences require deployment authority; generic async consumers must not receive them.
            scheduler:
                # The DSN path overrides options.stream in the Redis transport.
                dsn: '%env(REDIS_URL)%/scheduler_occurrences/baander'
                options:
                    stream: scheduler_occurrences
                    group: baander
                    consumer: '%env(MESSENGER_CONSUMER_NAME)%'
                    delete_after_ack: true
                    stream_max_entries: 0
                    redeliver_timeout: 3600
                    claim_interval: 60000
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 60000

            # Failure transport — a PostgreSQL table, because only a listable receiver
            # supports messenger:failed:show|retry|remove by id and the admin
            # endpoints. Migration Version20261006250000 owns the table.
            # LISTEN/NOTIFY stays off: nothing consumes this transport continuously,
            # and LISTEN would hold the shared DBAL connection.
            failed:
                dsn: 'doctrine://default'
                options:
                    table_name: '%app.messenger.failure_table%'
                    queue_name: '%app.messenger.failure_queue%'
                    auto_setup: false
                    use_notify: false
                # A retry that fails again goes straight back to this table through
                # RelistFailedRetrySubscriber; Symfony's default strategy would discard
                # the message after its third failed retry.
                retry_strategy:
                    max_retries: 0
                    delay: 0

        failure_transport: failed

        routing:
            # Catalog
            'App\Catalog\Application\Command\BatchExtractCoversCommand': async

            # Library
            'App\Library\Application\Command\ScanLibraryCommand': swoole_task
            'App\Library\Application\Message\FilesDiscovered': async

            # Metadata
            'App\Metadata\Application\Command\ExtractAlbumCoverCommand': async
            'App\Metadata\Application\Message\SyncSongMessage': swoole_task
            'App\Metadata\Application\Message\SyncAlbumMessage': swoole_task
            'App\Metadata\Application\Message\SyncLibraryMessage': swoole_task

            # Notification
            'App\Notification\Application\DTO\SendEmailCommand': swoole_task
            'App\Notification\Application\DTO\SendPushCommand': swoole_task

            # Media
            'App\Media\Application\Command\PruneMissingImagesCommand': swoole_task

            # Radio
            'App\Radio\Application\Command\SyncCountryStationsCommand': swoole_task

            # Scheduler
            'App\Scheduler\Application\Command\ExecuteScheduledOccurrenceCommand': scheduler

            # Outbox
            'App\Shared\Domain\Event\Outbox\RelayOutboxCommand': swoole_task

            # Transcode
            'App\Transcode\Application\Command\UpdateTranscodePositionCommand': swoole_task

        buses:
            messenger.bus.default:
                middleware:
                    - { id: 'App\Shared\Infrastructure\Messenger\CorrelationIdMiddleware' }
                    # Assigns the job ID before a transport stores the message.
                    - { id: 'App\Shared\Infrastructure\Messenger\JobMonitoringMiddleware' }
                    # Copies a synchronous handler's result into a typed stamp (app.result_stamp_classes);
                    # the WebSocket party.join reads PartyMemberResultStamp.
                    - { id: 'App\Shared\Infrastructure\Messenger\ResultStampMiddleware' }

when@test:
    framework:
        messenger:
            transports:
                # Override to use in-memory transport for tests
                swoole_task: 'in-memory://'
                async: 'in-memory://'
                scheduler: 'in-memory://'
                # The failure transport keeps its PostgreSQL table, so tests exercise
                # the listable receiver that the admin endpoints and CLI rely on.
            routing:
                'App\Tests\Fixtures\Messaging\FailureTransportProbe': async
