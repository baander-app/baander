framework:
    cache:
        # Default Redis provider for all pools. Every DSN carries a connect timeout and a
        # read timeout of 1 s (RedisClientFactory::TIMEOUT_SECONDS), so a Redis that
        # accepts connections but does not answer fails the request within a bound
        # instead of blocking its coroutine. Rate limiters use RedisClientFactory
        # directly, with the same timeouts.
        default_redis_provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379?timeout=1&read_timeout=1'

        # Redis-backed cache pools for Swoole workers
        app: cache.adapter.redis
        system: cache.adapter.redis

        pools:
            # Doctrine system cache (metadata, query) — indefinite, cleared on deploy
            doctrine.system_cache_pool:
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379?timeout=1&read_timeout=1'
                default_lifetime: 0

            # Doctrine result cache — 1 hour default, overridable per-query
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379?timeout=1&read_timeout=1'
                default_lifetime: 3600

            # Tag-aware cache for application-level invalidation (RedisTagAwareAdapter)
            # Requires Redis maxmemory-policy of noeviction or volatile-*
            cache.tags:
                tags: true
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379?timeout=1&read_timeout=1'
                default_lifetime: 3600

services:
    # Redis-backed session handler
    session.handler.redis:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        arguments:
            - '@redis.session.client'

    redis.session.client:
        class: Redis
        calls:
            # Connect and read timeouts match RedisClientFactory::TIMEOUT_SECONDS.
            - [connect, ['redis', 6379, 1.0, null, 0, 1.0]]
            - [auth, ['%env(REDIS_PASSWORD)%']]

when@test:
    framework:
        cache:
            app: cache.adapter.filesystem
            system: cache.adapter.filesystem
