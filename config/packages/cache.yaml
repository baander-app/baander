framework:
    cache:
        # Default Redis provider for all pools
        default_redis_provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379'

        # Redis-backed cache pools for Swoole workers
        app: cache.adapter.redis
        system: cache.adapter.redis

        pools:
            # Redis settings shared by the per-limiter pools below. No limiter stores
            # state here directly: each pool that uses it as adapter gets its own
            # namespace, so clearing one limiter's pool leaves the others intact.
            cache.rate_limiter:
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379'
                default_lifetime: 3600
            cache.rate_limiter.anonymous_api: { adapter: cache.rate_limiter }
            cache.rate_limiter.authenticated_api: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_login_ip: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_login_ip_email: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_register_ip: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_password_reset_ip: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_password_reset_email: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_refresh_client: { adapter: cache.rate_limiter }
            cache.rate_limiter.auth_passkey_ip: { adapter: cache.rate_limiter }
            cache.rate_limiter.config_check: { adapter: cache.rate_limiter }
            cache.rate_limiter.batch_cover_extract: { adapter: cache.rate_limiter }
            cache.rate_limiter.discovery_endpoint_ip: { adapter: cache.rate_limiter }

            # Doctrine system cache (metadata, query) — indefinite, cleared on deploy
            doctrine.system_cache_pool:
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379'
                default_lifetime: 0

            # Doctrine result cache — 1 hour default, overridable per-query
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379'
                default_lifetime: 3600

            # Tag-aware cache for application-level invalidation (RedisTagAwareAdapter)
            # Requires Redis maxmemory-policy of noeviction or volatile-*
            cache.tags:
                tags: true
                adapter: cache.adapter.redis
                provider: 'redis://default:%env(REDIS_PASSWORD)%@redis:6379'
                default_lifetime: 3600

services:
    # Redis-backed session handler
    session.handler.redis:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        arguments:
            - '@redis.session.client'

    redis.session.client:
        class: Redis
        calls:
            - [connect, ['redis', 6379]]
            - [auth, ['%env(REDIS_PASSWORD)%']]

when@test:
    framework:
        cache:
            app: cache.adapter.filesystem
            system: cache.adapter.filesystem
