framework:
    cache:
        # Default Redis provider for all pools. The pools authenticate as REDIS_URL's user
        # with its percent-decoded password, as every other Redis client does. Every DSN
        # carries a connect timeout and a read timeout of 1 s
        # (RedisClientFactory::TIMEOUT_SECONDS), so a Redis that accepts connections but
        # does not answer fails the request within a bound instead of blocking its
        # coroutine. Rate limiters use RedisClientFactory directly, with the same timeouts.
        default_redis_provider: '%env(REDIS_URL)%?timeout=1&read_timeout=1'

        app: cache.adapter.redis
        system: cache.adapter.system

        pools:
            doctrine.system_cache_pool:
                adapter: cache.system
                default_lifetime: 0

            # Doctrine result cache — 1 hour default, overridable per-query
            doctrine.result_cache_pool:
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%?timeout=1&read_timeout=1'
                default_lifetime: 3600

            # Tag-aware cache for application-level invalidation: Symfony's TagAwareAdapter
            # over a Redis pool, which keeps tag versions as ordinary cache items.
            cache.tags:
                tags: true
                adapter: cache.adapter.redis
                provider: '%env(REDIS_URL)%?timeout=1&read_timeout=1'
                default_lifetime: 3600

services:
    # Redis-backed session handler
    session.handler.redis:
        class: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        arguments:
            - '@redis.session.client'

    # A connection with RedisClientFactory's timeouts, authenticated as REDIS_URL's user.
    redis.session.client:
        class: Redis
        factory: ['@App\Shared\Infrastructure\Redis\RedisClientFactory', 'createStandaloneConnection']

when@test:
    framework:
        cache:
            app: cache.adapter.filesystem
            system: cache.adapter.filesystem
