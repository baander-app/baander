    App\Scheduler\Application\Port\SchedulerOccurrenceMaterializerInterface:
        alias: App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceMaterializer

    App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerRecoveryScheduleStore:
        factory: ['App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerRecoveryScheduleStore', 'fromDsn']
        arguments:
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Scheduler\Application\Port\SchedulerRecoveryScheduleStoreInterface:
        alias: App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerRecoveryScheduleStore

    App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerWorkerAuthority:
        factory: ['App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerWorkerAuthority', 'fromDsn']
        arguments:
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Scheduler\Application\Port\SchedulerWorkerAuthorityInterface:
        alias: App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerWorkerAuthority

    App\Scheduler\Infrastructure\Process\BoundedScheduledConsoleExecutor:
        factory: ['App\Scheduler\Infrastructure\Process\BoundedScheduledConsoleExecutor', 'fromWorkerEnvironment']
        arguments:
            $projectDirectory: '%kernel.project_dir%'

    App\Scheduler\Application\Port\ScheduledConsoleExecutorInterface:
        alias: App\Scheduler\Infrastructure\Process\BoundedScheduledConsoleExecutor

    # Occurrence admission must commit independently before effects; never share the ORM transaction.
    App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceExecutionStore:
        factory: ['App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceExecutionStore', 'fromDsn']
        arguments:
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Scheduler\Application\Port\SchedulerOccurrenceExecutionStoreInterface:
        alias: App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceExecutionStore

    # Delivery reservations commit before Redis sends. This does not enable a poller or relay loop.
    App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceDispatchStore:
        factory: ['App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceDispatchStore', 'fromDsn']
        arguments:
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Scheduler\Application\Port\SchedulerOccurrenceDispatchStoreInterface:
        alias: App\Scheduler\Infrastructure\Doctrine\DoctrineSchedulerOccurrenceDispatchStore

    App\Scheduler\Infrastructure\Messenger\MessengerSchedulerOccurrencePublisher:
        arguments:
            $sender: '@messenger.transport.scheduler'

    App\Scheduler\Application\Port\SchedulerOccurrencePublisherInterface:
        alias: App\Scheduler\Infrastructure\Messenger\MessengerSchedulerOccurrencePublisher

    # --- Scheduler Registry ---
    App\Scheduler\Domain\Service\SchedulerRegistry:
        arguments:
            $messengerCommandProviders: !tagged_iterator 'scheduler.messenger_command'
            $consoleCommandProviders: !tagged_iterator 'scheduler.console_command'

    # Private child entrypoint; not a separately exposed console command.
    scheduler.worker_runner:
        alias: App\Scheduler\Infrastructure\Process\SchedulerWorkerRunner
        public: true

    # --- Discovery Domain Repository Aliases ---
    App\Discovery\Domain\Repository\ServerInstanceRepositoryInterface:
        alias: App\Discovery\Infrastructure\Doctrine\Repository\ServerInstanceRepository
    App\Discovery\Domain\Repository\PairingSessionRepositoryInterface:
        alias: App\Discovery\Infrastructure\Doctrine\Repository\PairingSessionRepository

    # --- Discovery Application Port Aliases ---
    App\Discovery\Application\Port\DiscoveryPortInterface:
        alias: App\Discovery\Infrastructure\DiscoveryService
    App\Discovery\Application\Port\ServerInstancePortInterface:
        alias: App\Discovery\Infrastructure\ServerInstanceService

    # --- Favorites Domain Repository Aliases ---
    App\Favorites\Domain\Repository\UserFavoriteRepositoryInterface:
        alias: App\Favorites\Infrastructure\Doctrine\Repository\UserFavoriteRepository

    # --- Favorites Application Port Aliases ---
    App\Favorites\Application\Port\FavoritesPortInterface:
        alias: App\Favorites\Infrastructure\FavoritesService

    # --- Outbox Wiring ---
    App\Shared\Domain\Event\Outbox\OutboxRepository: ~
    App\Shared\Domain\Event\Outbox\OutboxSubscriber: ~
    App\Shared\Domain\Event\Outbox\RelayOutboxHandler: ~
    App\Shared\Domain\Event\Outbox\OutboxEventDispatcherInterface:
        alias: App\Shared\Infrastructure\Event\OutboxEventDispatcher
    App\Shared\Infrastructure\Event\OutboxEventDispatcher:
        arguments:
            $dispatcher: '@App\Shared\Infrastructure\Event\NotificationReplayDispatcher'
    App\Shared\Infrastructure\Event\NotificationReplayDispatcher:
        arguments:
            $providers: !tagged_iterator baander.notification_replay_listeners
    # Replay registers notification projection before admin alerts.
    App\Notification\Infrastructure\Event\NotificationBridgeSubscriber:
        tags: [{ name: baander.notification_replay_listeners, priority: 10 }]
    App\Auth\Infrastructure\Event\AdminAlertSubscriber:
        tags: [{ name: baander.notification_replay_listeners, priority: 0 }]
    App\Shared\Application\Port\SleeperInterface:
        alias: App\Shared\Infrastructure\Swoole\AsyncSleeper
    App\Shared\Application\Port\DeliveryIntentResolverInterface:
        alias: App\Notification\Infrastructure\Messaging\NotificationDeliveryIntentResolver
    App\Notification\Application\Handler\CreateNotificationHandler:
        arguments:
            $bus: '@App\Shared\Infrastructure\Event\NotificationDeliveryBus'

    # --- QoL Governor ---
    App\QoL\Domain\Service\StreamGovernor:
        arguments:
            $model: '@App\QoL\Domain\Service\LearningModel'

    App\QoL\Domain\Service\LearningModel: ~

    # QoL CPU/GPU sampler — Bootable (Table created before fork)
    App\QoL\Infrastructure\Swoole\CpuGpuSampler:
        tags:
            - { name: 'swoole_bundle.bootable_service' }

    App\QoL\Infrastructure\Swoole\QoLWorkerStartupSubscriber:
        arguments:
            $services: !service_locator
                App\QoL\Infrastructure\Swoole\CpuGpuSampler: '@App\QoL\Infrastructure\Swoole\CpuGpuSampler'
                App\QoL\Infrastructure\Swoole\MidStreamMonitor: '@App\QoL\Infrastructure\Swoole\MidStreamMonitor'
                App\QoL\Infrastructure\Swoole\LearningDataPersister: '@App\QoL\Infrastructure\Swoole\LearningDataPersister'
                App\QoL\Domain\Service\StreamGovernor: '@App\QoL\Domain\Service\StreamGovernor'
                App\QoL\Application\Port\EncoderProfileFingerprintPortInterface: '@App\QoL\Application\Port\EncoderProfileFingerprintPortInterface'

    App\QoL\Application\Port\EncoderProfileFingerprintPortInterface:
        alias: App\Transcode\Infrastructure\FFmpeg\EncoderProfileFingerprintAdapter

    # QoL Learning Engine
    App\QoL\Infrastructure\Swoole\LearningDataPersister:
        arguments:
            $stateDir: '%kernel.project_dir%/var/qol_state'
            $jsonEncoder: '@json_encoder'

    # QoL contracts implemented by Transcode Infrastructure
    App\QoL\Domain\Port\QualityLadderPortInterface:
        alias: App\Transcode\Infrastructure\Transcode\QualityLadderPort

    # QoL stream admission and completion. Transcode Infrastructure listeners call it:
    # StreamAdmissionListener (TranscodeSessionAttached, priority 1, synchronous veto)
    # and StreamCompletionListener (TranscodeJobCompleted, CoWrapper offload).
    App\QoL\Application\Port\StreamAdmissionPortInterface:
        alias: App\QoL\Infrastructure\StreamAdmissionService

    App\QoL\Application\Port\AllowedQualityTiersPortInterface:
        alias: App\QoL\Infrastructure\AllowedQualityTiersService

    # Mid-stream budget guard. It has had no caller since long FFmpeg streams
    # replaced per-segment dispatch; wiring it into long streams is an open question.
    App\QoL\Application\Port\BudgetGuardInterface:
        alias: App\QoL\Infrastructure\Transcode\BudgetGuard

    App\QoL\Infrastructure\Transcode\BudgetGuard: ~

    # Transcode manifest filtering by QoL's allowed tiers
    # Chain: alias → CachedTranscodeStreamingService → QualityFilteringStreamingDecorator → TranscodeStreamingService
    App\Transcode\Infrastructure\QoL\QualityFilteringStreamingDecorator:
        decorates: App\Transcode\Infrastructure\Transcode\TranscodeStreamingService
        decoration_priority: -1
        arguments:
            $inner: '@.inner'

    # QoL Mid-Stream Monitor
    App\QoL\Infrastructure\Swoole\MidStreamMonitor: ~

    # QoL Admin
    App\QoL\Application\Port\QoLAdminPortInterface:
        alias: App\QoL\Infrastructure\QoLAdminService

    App\QoL\Infrastructure\QoLAdminService: ~

    App\Shared\Infrastructure\Worker\WorkerSupervisorRunner:
        arguments:
            $projectDirectory: '%kernel.project_dir%'
            $databaseUrl: '%env(resolve:DATABASE_URL)%'

    App\Shared\Application\Port\WorkerSupervisorRunnerInterface:
        alias: App\Shared\Infrastructure\Worker\WorkerSupervisorRunner

when@test:
    parameters:
        notification.push.allowed_domains: ['push.baander.app']
    services:
        # A message whose handler fails on demand, for failure transport tests.
        App\Tests\Fixtures\Messaging\FailureTransportProbeCodec:
            tags: ['baander.message_payload_codec']
        App\Tests\Fixtures\Messaging\FailureTransportProbeHandler:
            tags: [{ name: 'messenger.message_handler' }]
        # Resolve the production user settings contract for integration checks.
        test.user_settings_contract:
            alias: App\UserPreference\Application\Port\UserSettingsContractInterface
            public: true
        # User settings that only the user settings API tests use.
        App\Tests\Fixtures\Settings\TestUserSettingDefinitions:
            tags: ['baander.setting_definition_provider']
        test.scheduler_manual_recorder:
            alias: App\Scheduler\Application\Port\SchedulerManualOccurrenceRecorderInterface
            public: true
        # Resolve the production scheduler graph for integration checks.
        test.scheduler_worker_runner:
            alias: App\Scheduler\Infrastructure\Process\SchedulerWorkerRunner
            public: true
        test.scheduler_recovery_poller:
            alias: App\Scheduler\Application\Service\SchedulerRecoveryPoller
            public: true
        # Keep the real relay graph available for integration checks.
        test.scheduler_occurrence_relay:
            alias: App\Scheduler\Application\Service\SchedulerOccurrenceRelay
            public: true
