name: baander
entry: application-entry.php
sources:
  - application-entry.php
build-dir: ../../var/typephp/application
output: ../../var/typephp/baander
mode: bin
sapi: cli
php-version: '8.5'
optimize: 2
php-builder:
  zts: on
  debug: off
  extensions:
    - curl
    - dom
    - exif
    - excimer
    - ffi
    - filter
    - gettext
    - igbinary
    - imagick
    - intl
    - mailparse
    - mbstring
    - msgpack
    - mysqlnd
    - pdo_pgsql
    - pdo_sqlite
    - phar
    - readline
    - session
    - shmop
    - simplexml
    - sodium
    - sqlite3
    - sysvmsg
    - tokenizer
    - uv
    - xml
    - xmlreader
    - xmlwriter
    - yaml
    - zip
    - zlib
embedded-files:
  - ../../bin/console
  - ../../bin/worker-deployment.php
  - ../../src
  - ../../packages/baander-http-client/src
  - ../../packages/baander-redis-rate-limiter/src
  - ../../packages/baander-image-processing/src
  - ../../packages/baander-media-metadata/src
  - ../../vendor
  - ../../packages/swoole-bundle/src
  - ../../packages/tsduck-php-ffi/src
  - ../../composer.json
  - ../../config/bundles.php
  - ../../config/packages
  - ../../config/routes
  - ../../config/routes.yaml
  - ../../config/services.yaml
  - ../../config/services_packages.yaml
  - ../../config/services_baander_navigator.yaml
  - ../../templates
  - ../../translations
