# Supply the backup user's rqlite username:password in the private mounted copy.
# user = ""
# The node CA, which signed the voters' certificates.
cacert = "/run/secrets/registry-backup/rqlite-ca.crt"
# Issued by the client CA in the voters' client-ca.crt, never by the node CA.
cert = "/run/secrets/registry-backup/client.crt"
key = "/run/secrets/registry-backup/client.key"
