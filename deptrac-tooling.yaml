deptrac:
  paths:
    - packages/baander-configuration/src
    - packages/baander-containers/src
    - packages/baander-core/src
    - packages/baander-core/tests
    - packages/baander-deployment/src
    - packages/baander-dev-ci/src
    - packages/baander-dev-dependencies/src
    - packages/baander-dev-environment/src
    - packages/baander-dev-qualification/src
    - packages/baander-dev-registry/src
    - packages/baander-dev-website/src
    - packages/baander-filesystem/src
    - packages/baander-images/src
    - packages/baander-process/src
    - packages/baander-configuration/tests
    - packages/baander-containers/tests
    - packages/baander-deployment/tests
    - packages/baander-dev-ci/tests
    - packages/baander-dev-dependencies/tests
    - packages/baander-dev-environment/tests
    - packages/baander-dev-qualification/tests
    - packages/baander-dev-registry/tests
    - packages/baander-dev-website/tests
    - packages/baander-filesystem/tests
    - packages/baander-images/tests
    - packages/baander-process/tests
    - scripts
    - relay/tools
    - relay/tests
    - tests/Support/Tooling
    - tests/Tooling
    - packages/baander-configuration/resources
    - packages/baander-dev-dependencies/resources
    - packages/baander-dev-environment/resources
    - packages/baander-dev-qualification/resources
    - packages/baander-process/resources
  exclude_files:
    - '#/(vendor|node_modules)/#'
  analyser:
    types:
      - class
      - use
      - function
      - function_call
      - file
  ignore_uncovered_internal_classes: true
  layers:
    -
      name: Core
      collectors:
        -
          type: classLike
          value: ^Baander\\Core\\(?!Tests\\)
    -
      name: Website
      collectors:
        -
          type: classLike
          value: ^Baander\\DevWebsite\\(?!Tests\\)
        -
          type: directory
          value: /packages/baander-dev-website/src/
    -
      name: Architecture
      collectors:
        -
          type: classLike
          value: ^Baander\\DevCi\\Architecture\\
        -
          type: directory
          value: /packages/baander-dev-ci/src/Architecture/
    -
      name: Configuration
      collectors:
        -
          type: classLike
          value: ^Baander\\Configuration\\(?!Tests\\)
        -
          type: directory
          value: /packages/baander-configuration/src/
    -
      name: Filesystem
      collectors:
        -
          type: classLike
          value: ^Baander\\Filesystem\\(?!Tests\\)
        -
          type: directory
          value: /packages/baander-filesystem/src/
    -
      name: Process
      collectors:
        -
          type: classLike
          value: ^Baander\\Process\\Execution\\
        -
          type: directory
          value: /packages/baander-process/src/Execution/
    -
      name: Docker
      collectors:
        -
          type: classLike
          value: ^Baander\\Containers\\Docker\\
        -
          type: directory
          value: /packages/baander-containers/src/Docker/
    -
      name: Resources
      collectors:
        -
          type: classLike
          value: ^Baander\\Containers\\Resources\\
        -
          type: directory
          value: /packages/baander-containers/src/Resources/
    -
      name: Inventory
      collectors:
        -
          type: classLike
          value: ^Baander\\Images\\Inventory\\
        -
          type: directory
          value: /packages/baander-images/src/Inventory/
    -
      name: Build
      collectors:
        -
          type: classLike
          value: ^Baander\\Images\\Build\\
        -
          type: directory
          value: /packages/baander-images/src/Build/
    -
      name: CommandLine
      collectors:
        -
          type: classLike
          value: ^Baander\\Process\\Arguments\\
        -
          type: directory
          value: /packages/baander-process/src/Arguments/
    -
      name: Runtime
      collectors:
        -
          type: classLike
          value: ^Baander\\Process\\Runtime\\
        -
          type: directory
          value: /packages/baander-process/src/Runtime/
    -
      name: Deployment
      collectors:
        -
          type: classLike
          value: ^Baander\\Deployment\\(?!Tests\\)
        -
          type: directory
          value: /packages/baander-deployment/src/
    -
      name: Development
      collectors:
        -
          type: classLike
          value: '^Baander\\DevEnvironment\\(?!Tests\\)'
        -
          type: directory
          value: /packages/baander-dev-environment/src/
    -
      name: Acceptance
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Acceptance\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Acceptance/
    -
      name: Backend
      collectors:
        -
          type: classLike
          value: ^Baander\\DevCi\\Backend\\
        -
          type: directory
          value: /packages/baander-dev-ci/src/Backend/
    -
      name: FixturesHttp
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Fixtures\\Http\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Fixtures/Http/
    -
      name: FixturesWeb
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Fixtures\\Web\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Fixtures/Web/
    -
      name: FixturesWorker
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Fixtures\\Worker\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Fixtures/Worker/
    -
      name: FixturesMessaging
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Fixtures\\Messaging\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Fixtures/Messaging/
    -
      name: FixturesStartup
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Fixtures\\Startup\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Fixtures/Startup/
    -
      name: FixturesQualification
      collectors:
        -
          type: classLike
          value: ^Baander\\DevQualification\\Fixtures\\Qualification\\
        -
          type: directory
          value: /packages/baander-dev-qualification/src/Fixtures/Qualification/
    -
      name: Fixtures
      collectors:
        -
          type: classLike
          value: '^Baander\\DevQualification\\Fixtures\\(?!Http\\|Web\\|Worker\\|Messaging\\|Startup\\|Qualification\\)'
        -
          type: directory
          value: '/packages/baander-dev-qualification/src/Fixtures/(?!Http/|Web/|Worker/|Messaging/|Startup/|Qualification/)'
    -
      name: Registry
      collectors:
        -
          type: classLike
          value: ^Baander\\DevRegistry\\(?!Tests\\)
        -
          type: directory
          value: /packages/baander-dev-registry/src/
    -
      name: Dependencies
      collectors:
        -
          type: classLike
          value: ^Baander\\DevDependencies\\Php\\
        -
          type: directory
          value: /packages/baander-dev-dependencies/src/Php/
    -
      name: JavaScriptDependencies
      collectors:
        -
          type: classLike
          value: ^Baander\\DevDependencies\\JavaScript\\
        -
          type: directory
          value: /packages/baander-dev-dependencies/src/JavaScript/
    -
      name: Ci
      collectors:
        -
          type: classLike
          value: ^Baander\\DevCi\\Artifacts\\
        -
          type: directory
          value: /packages/baander-dev-ci/src/Artifacts/
    -
      name: ComposerSemver
      collectors:
        -
          type: classLike
          value: ^Composer\\Semver\\
    -
      name: CLI
      collectors:
        -
          type: directory
          value: '/scripts/(?!tests/|vendor/).*\.php$'
    -
      name: ToolingTests
      collectors:
        -
          type: classLike
          value: ^Baander\\Tests\\Tooling\\
        -
          type: directory
          value: '(?:/packages/baander-[^/]+/tests/|/tests/(?:Support/Tooling|Tooling)/|/scripts/tests/).*\.php$'
    -
      name: RegistryTests
      collectors:
        -
          type: classLike
          value: ^Baander\\RegistryTests\\
        -
          type: directory
          value: '/relay/tests/.*\.php$'
    -
      name: RelayHelpers
      collectors:
        -
          type: classLike
          value: ^Baander\\Registry\\
        -
          type: directory
          value: '/relay/tools/(?:inventory|qualification|static)/(?!cleanup\.php$).*\.php$'
    -
      name: PackageEntrypoints
      collectors:
        -
          type: directory
          value: '/packages/baander-[^/]+/(?:resources|bin)/.*\.php$'
    -
      name: RelayCLI
      collectors:
        -
          type: directory
          value: '/relay/tools/(?:[^/]+|qualification/cleanup)\.php$'
  ruleset:
    Core: {  }
    Website:
      - Core
      - Configuration
      - Filesystem
      - Process
    Architecture:
      - Core
    Configuration:
      - Core
      - Filesystem
      - Process
    Filesystem:
      - Core
    Process:
      - Core
      - Filesystem
    Docker:
      - Core
      - Configuration
      - Filesystem
      - Process
    Resources:
      - Core
      - Docker
      - Filesystem
      - Process
    Inventory:
      - Core
      - Configuration
      - Docker
      - Filesystem
      - Process
      - Resources
      - Runtime
    Build:
      - Core
      - Configuration
      - Docker
      - Filesystem
      - Inventory
      - Process
    CommandLine:
      - Core
    Runtime:
      - Core
    Deployment:
      - Core
      - CommandLine
      - Configuration
      - Docker
      - Filesystem
      - Process
      - Resources
      - Runtime
    Development:
      - Core
      - Build
      - Deployment
      - CommandLine
      - Configuration
      - Docker
      - Filesystem
