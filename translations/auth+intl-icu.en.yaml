password_reset_email:
  subject: "Reset your {app} password"
  heading: "Reset your password"
  greeting: "Hi {name},"
  intro: "Someone asked to reset the password for your {app} account. Open the link below to choose a new password."
  action: "Choose a new password"
  fallback: "If the button does not work, copy this link into your browser:"
  expiry: "The link works once and expires in {minutes, plural, one {# minute} other {# minutes}}."
  ignore: "If you did not ask for this, ignore this email. Your password stays the same."

registration_attempt_email:
  subject: "Someone tried to sign up for {app} with your email address"
  heading: "Someone tried to sign up with your address"
  greeting: "Hi {name},"
  intro: "Someone tried to create a new {app} account with this email address. You already have an account, so no new account was created and nothing about your account changed."
  forgot: "If it was you and you have forgotten your password, you can choose a new one here:"
  action: "Choose a new password"
  fallback: "If the button does not work, copy this link into your browser:"
  ignore: "If it was not you, ignore this email. Your password stays the same."

email_changed_email:
  subject: "The email address of your {app} account changed"
  heading: "Your email address changed"
  greeting: "Hi {name},"
  intro: "The email address of your {app} account was changed. Emails about the account, including password reset links, now go to the new address and no longer to this one."
  unexpected: "If you did not make this change, contact your server administrator right away."

email_verification_email:
  subject: "Verify your email address for {app}"
  heading: "Verify your email address"
  greeting: "Hi {name},"
  intro: "Confirm that this address belongs to your {app} account. Open the link below to verify it."
  action: "Verify email address"
  fallback: "If the button does not work, copy this link into your browser:"
  expiry: "The link works once and expires in {hours, plural, one {# hour} other {# hours}}."
  ignore: "If you did not create an account or change your email address, ignore this email."

email_verification:
  resend_sent: "If your email address still needs verification, a new link has been sent."
