user:
  password_changed:
    title: "Password changed"
    body: "Your account password was changed."
  passkey_registered:
    title: "Passkey registered"
    body: "A new passkey \"{name}\" was registered on your account."
  passkey_deleted:
    title: "Passkey removed"
    body: "A passkey was removed from your account."
  registered:
    title: "Account created"
    body: "Welcome, {name}! Your account has been created."

token:
  revoked:
    title: "Token revoked"
    body: "A {tokenType} token was revoked."

device_code:
  approved:
    title: "Device approved"
    body: "A new device was authorized to access your account."

library:
  scan_completed:
    title: "Library scan completed"
    body: "Scan completed: {filesDiscovered} files discovered, {filesProcessed} processed."

album:
  created:
    title: "New album in library"
    body: "A new album was added to your library."

# Used when an event lacks the value.
parameter:
  unknown_passkey_name: "Unknown"
  unknown_user_name: "User"
  unknown_token_type: "access"

email:
  header:
    security: "{appName} Security Alert"
    default: "{appName}"
  view: "View in {appName}"
  footer:
    security: "You received this email because you have security notifications enabled in {appName}."
    background_jobs: "You received this email because you have background job notifications enabled in {appName}."
    media_changes: "You received this email because you have media change notifications enabled in {appName}."
