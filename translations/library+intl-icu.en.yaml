# The English text matches the exceptions' getMessage(), which console commands print.
errors:
  invalid_type_with_allowed: 'Invalid library type "{type}". Allowed: {allowed}.'
  slug_exists: 'A library with the slug "{slug}" already exists.'
  root_overlaps: 'The path "{path}" lies inside or contains the root "{root}" of the library "{library}".'
  not_found: 'Library "{library}" not found.'
  library_busy:
    scan: 'A scan is already in progress for the library "{library}".'
    delete: 'A delete with files is in progress for the library "{library}".'
