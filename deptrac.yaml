# deptrac.yaml — Deptrac v4 configuration for Bånder DDD modular monolith
#
# Enforces:
#   1. Layer ordering within each context (Domain → Application → Infrastructure / Interface)
#   2. Context isolation (Shared and explicitly exposed application contracts only)
#   3. Infrastructure leak prevention (Domain/Application never depend on Infrastructure)
#
# Existing violations are baselined in deptrac.baseline.yaml.
# To regenerate: vendor/bin/deptrac analyse --formatter=baseline --output=deptrac.baseline.yaml

imports:
  - deptrac.baseline.yaml

deptrac:
  paths:
    - src/

  exclude_files:
    - '#.*vendor/.*#'

  analyser:
    types:
      - class
      - use

  ignore_uncovered_internal_classes: true

  formatters:
    graphviz:
      groups:
        Shared: ['Shared Domain', 'Shared Application', 'Shared Infrastructure', 'Shared Interface']
        Activity: ['Activity Domain', 'Activity Application', 'Activity Infrastructure', 'Activity Resources', 'Activity Interface']
        Auth: ['Auth Domain', 'Auth Identity Contract', 'Auth Application', 'Auth Infrastructure', 'Auth Resources', 'Auth Interface']
        Catalog: ['Catalog Domain', 'Catalog Application', 'Catalog Infrastructure', 'Catalog Resources', 'Catalog Interface']
        Filesystem: ['Filesystem Infrastructure', 'Filesystem Application', 'Filesystem Command', 'Filesystem Mime', 'Filesystem Watcher']
        Library: ['Library Read Scope Contract', 'Library Domain', 'Library Application', 'Library Infrastructure', 'Library Resources', 'Library Interface']
        Lyrics: ['Lyrics Domain', 'Lyrics Application', 'Lyrics Infrastructure', 'Lyrics Resources', 'Lyrics Interface']
        Media: ['Media Domain', 'Media Application', 'Media Infrastructure', 'Media Resources', 'Media Interface']
        Metadata: ['Metadata Domain', 'Metadata Application', 'Metadata Infrastructure', 'Metadata Interface']
        Notification: ['Notification Domain', 'Notification Application', 'Notification Infrastructure', 'Notification Resources', 'Notification Interface']
        Party: ['Party Domain', 'Party Application', 'Party Infrastructure', 'Party Resources', 'Party Interface']
        Playlist: ['Playlist Deletion Preview Contract', 'Playlist Domain', 'Playlist Application', 'Playlist Infrastructure', 'Playlist Resources', 'Playlist Interface']
        Recommendation: ['Recommendation Domain', 'Recommendation Application', 'Recommendation Infrastructure', 'Recommendation Resources', 'Recommendation Interface']
        Transcode: ['Transcode Domain', 'Transcode Application', 'Transcode Infrastructure', 'Transcode Resources', 'Transcode Interface']
        UserPreference: ['UserPreference Domain', 'UserPreference Application', 'UserPreference Infrastructure', 'UserPreference Resources', 'UserPreference Interface']
        Discovery: ['Discovery Domain', 'Discovery Application', 'Discovery Infrastructure', 'Discovery Resources', 'Discovery Interface']
        Favorites: ['Favorites Domain', 'Favorites Application', 'Favorites Infrastructure', 'Favorites Resources', 'Favorites Interface']
        Radio: ['Radio Domain', 'Radio Application', 'Radio Infrastructure', 'Radio Resources', 'Radio Interface']
        Scheduler: ['Scheduler Domain', 'Scheduler Application', 'Scheduler Infrastructure', 'Scheduler Resources', 'Scheduler Interface']
        Session: ['Session Domain', 'Session Application', 'Session Infrastructure', 'Session Resources', 'Session Interface']
        QoL: ['QoL Domain', 'QoL Application', 'QoL Infrastructure', 'QoL Resources', 'QoL Interface']
        Command: ['Command Utility']

  layers:
    # =============================================
    # Shared kernel
    # =============================================
    - name: 'Shared Domain'
      collectors:
        - type: classLike
          value: '^App\\Shared\\Domain\\'

    - name: 'Shared Application'
      collectors:
        - type: classLike
          value: '^App\\Shared\\Application\\'

    - name: 'Shared Infrastructure'
      collectors:
        - type: classLike
          value: '^App\\Shared\\Infrastructure\\'

    - name: 'Shared Interface'
      collectors:
        - type: classLike
          value: '^App\\Shared\\Interface\\'

    # =============================================
    # Activity
    # =============================================
    - name: 'Activity Domain'
      collectors:
        - type: classLike
          value: '^App\\Activity\\Domain\\'

    - name: 'Activity Application'
      collectors:
        - type: classLike
          value: '^App\\Activity\\Application\\'

    - name: 'Activity Infrastructure'
      collectors:
        - type: classLike
          value: '^App\\Activity\\Infrastructure\\'

    - name: 'Activity Resources'
      collectors:
        - type: classLike
          value: '^App\\Activity\\Interface\\Resource\\'

    - name: 'Activity Interface'
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^App\\Activity\\Interface\\'
          must_not:
            - type: classLike
              value: '^App\\Activity\\Interface\\Resource\\'

    # =============================================
    # Auth
    # =============================================
    - name: 'Auth Domain'
      collectors:
        - type: classLike
          value: '^App\\Auth\\Domain\\'

    # Only this security-principal contract is public across context boundaries.
    - name: 'Auth Identity Contract'
      collectors:
        - type: classLike
          value: '^App\\Auth\\Application\\Port\\AuthenticatedUserIdentityInterface$'

    - name: 'Auth Application'
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^App\\Auth\\Application\\'
          must_not:
            - type: classLike
              value: '^App\\Auth\\Application\\Port\\AuthenticatedUserIdentityInterface$'

    - name: 'Auth Infrastructure'
      collectors:
        - type: classLike
          value: '^App\\Auth\\Infrastructure\\'

    - name: 'Auth Resources'
      collectors:
        - type: classLike
          value: '^App\\Auth\\Interface\\Resource\\'

    - name: 'Auth Interface'
      collectors:
        - type: bool
          must:
            - type: classLike
              value: '^App\\Auth\\Interface\\'
          must_not:
            - type: classLike
