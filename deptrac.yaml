          value: '^App\\QoL\\Domain\\'

    - name: 'QoL Application'
      collectors:
        - type: classLike
          value: '^App\\QoL\\Application\\'

    - name: 'QoL Infrastructure'
      collectors:
        - type: classLike
          value: '^App\\QoL\\Infrastructure\\'

    - name: 'QoL Resources'
      collectors:
        - type: classLike
          value: '^App\\QoL\\Interface\\Resource\\'

    - name: 'QoL Interface'
