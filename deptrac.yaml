    # =============================================
    - name: 'UserPreference Domain'
      collectors:
        - type: classLike
          value: '^App\\UserPreference\\Domain\\'

    - name: 'UserPreference Application'
      collectors:
        - type: classLike
          value: '^App\\UserPreference\\Application\\'

    - name: 'UserPreference Infrastructure'
      collectors:
