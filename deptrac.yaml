  ruleset:
    # =============================================
    # IDEAL RULES — these define the target architecture.
    # Existing violations are baselined in deptrac.baseline.yaml.
    #
    # Standard pattern for each context:
    #   Domain       → Shared Domain
    #   Application  → own Domain, Shared Domain, Shared Application
    #   Infrastructure → own Domain, own Application, Shared Domain/Application/Infrastructure
    #   Interface    → own Application, Shared Domain, Shared Application, Shared Interface
    # =============================================

    # --- Shared ---
    'Shared Domain': ~
    'Shared Application':
      - 'Shared Domain'
    'Shared Infrastructure':
      - 'Shared Domain'
      - 'Shared Application'
    'Shared Interface':
      - 'Shared Domain'
      - 'Shared Application'
      - 'Shared Infrastructure'

    # --- Activity ---
    'Activity Domain':
      - 'Shared Domain'
    'Activity Application':
      - 'Activity Domain'
      - 'Shared Domain'
      - 'Shared Application'
    'Activity Infrastructure':
      - 'Shared Application'
      - 'Activity Domain'
      - 'Activity Application'
      - 'Shared Domain'
      - 'Shared Infrastructure'
    'Activity Resources':
      - 'Activity Application'
      - 'Shared Application'
      - 'Activity Domain'
      - 'Shared Domain'
      - 'Shared Interface'
    'Activity Interface':
      - 'Activity Resources'
      - 'Auth Identity Contract'
      - 'Activity Application'
      - 'Shared Domain'
      - 'Shared Application'
      - 'Shared Interface'

    # --- Auth ---
    'Auth Identity Contract': []
    'Auth Domain':
      - 'Shared Domain'
    'Auth Application':
      - 'Auth Identity Contract'
      - 'Auth Domain'
      - 'Shared Domain'
      - 'Shared Application'
    'Auth Infrastructure':
      - 'Shared Application'
      - 'Auth Identity Contract'
      - 'Auth Domain'
      - 'Auth Application'
      - 'Shared Domain'
      - 'Shared Infrastructure'
    'Auth Resources':
      - 'Auth Application'
      - 'Shared Application'
      - 'Auth Domain'
      - 'Shared Domain'
      - 'Shared Interface'
    'Auth Interface':
      - 'Auth Resources'
      - 'Auth Identity Contract'
      - 'Auth Application'
      - 'Shared Domain'
      - 'Shared Application'
      - 'Shared Interface'

    # --- Catalog ---
    'Catalog Domain':
      - 'Shared Domain'
    'Catalog Application':
      - 'Catalog Domain'
      - 'Shared Domain'
      - 'Shared Application'
    'Catalog Infrastructure':
      - 'Shared Application'
      - 'Catalog Domain'
      - 'Catalog Application'
      - 'Shared Domain'
      - 'Shared Infrastructure'
    'Catalog Resources':
      - 'Catalog Application'
      - 'Shared Application'
      - 'Catalog Domain'
      - 'Shared Domain'
      - 'Shared Interface'
    'Catalog Interface':
      - 'Playlist Deletion Preview Contract'
      - 'Library Read Scope Contract'
      - 'Catalog Resources'
      - 'Catalog Application'
      - 'Shared Domain'
      - 'Shared Application'
      - 'Shared Interface'

    # --- Filesystem (utility) ---
    'Filesystem Application':
      - 'Shared Domain'
    'Filesystem Command':
      - 'Filesystem Application'
      - 'Shared Domain'
    'Filesystem Mime':
      - 'Shared Domain'
    'Filesystem Watcher':
      - 'Filesystem Application'
      - 'Shared Domain'

    # --- Library ---
    'Library Read Scope Contract':
      - 'Shared Domain'
    'Library Domain':
      - 'Shared Domain'
    'Library Application':
      - 'Library Read Scope Contract'
      - 'Library Domain'
      - 'Shared Domain'
      - 'Shared Application'
    'Library Infrastructure':
      - 'Auth Identity Contract'
      - 'Library Read Scope Contract'
      - 'Shared Application'
      - 'Library Domain'
      - 'Library Application'
      - 'Shared Domain'
      - 'Shared Infrastructure'
    'Library Resources':
      - 'Library Application'
      - 'Shared Application'
      - 'Library Domain'
      - 'Shared Domain'
      - 'Shared Interface'
    'Library Interface':
      - 'Library Read Scope Contract'
      - 'Library Resources'
      - 'Auth Identity Contract'
      - 'Library Application'
      - 'Shared Domain'
      - 'Shared Application'
      - 'Shared Interface'

    # --- Lyrics ---
    'Lyrics Domain':
      - 'Shared Domain'
    'Lyrics Infrastructure':
      - 'Shared Application'
      - 'Lyrics Application'
      - 'Lyrics Domain'
      - 'Shared Domain'
      - 'Shared Infrastructure'

    # --- Media ---
    'Media Domain':
      - 'Shared Domain'
    'Media Application':
      - 'Media Domain'
      - 'Shared Domain'
      - 'Shared Application'
    'Media Infrastructure':
      - 'Auth Identity Contract'
      - 'Library Read Scope Contract'
      - 'Shared Application'
      - 'Media Domain'
      - 'Media Application'
      - 'Shared Domain'
      - 'Shared Infrastructure'
    'Media Resources':
      - 'Media Application'
      - 'Shared Application'
      - 'Media Domain'
      - 'Shared Domain'
      - 'Shared Interface'
    'Media Interface':
      - 'Media Resources'
      - 'Media Application'
      - 'Shared Domain'
      - 'Shared Application'
      - 'Shared Interface'

    # --- Metadata ---
    'Metadata Domain':
      - 'Shared Domain'
    'Metadata Application':
      - 'Metadata Domain'
      - 'Shared Domain'
      - 'Shared Application'
    'Metadata Infrastructure':
      - 'Shared Application'
      - 'Metadata Domain'
