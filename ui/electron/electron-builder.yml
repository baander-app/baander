appId: app.baander.desktop
productName: "Bånder"

# Displayed in app metadata and installers
copyright: "© 2025-2026 Martin Christiansen"

directories:
    output: dist/release
    buildResources: build

files:
    -   from: "dist/renderer"
        to: "."
    -   from: "dist/main"
        to: "."
    -   from: "public"
        to: "public"
    -   from: "dist/preload"
        to: "."
    - package.json
    # The native AAC codec ships as its ESM entry, types and compiled binding
    # only; the C++ sources it was built from stay out of the bundle.
    - "!node_modules/@baander/aac-native/**"
    - "node_modules/@baander/aac-native/package.json"
    - "node_modules/@baander/aac-native/node/index.js"
    - "node_modules/@baander/aac-native/node/index.d.ts"
    - "node_modules/@baander/aac-native/build/Release/*.node"

# The binding is loaded with process.dlopen, which cannot read from inside
# the asar archive, so both places the loader looks are unpacked next to it.
asarUnpack:
    - "node_modules/@baander/aac-native/build/Release/*.node"
    - "node_modules/@baander/aac-native/prebuilds/**/*.node"

extraResources:
    -   from: "public/dsp"
        to: "dsp"

extraMetadata:
    main: index.js

win:
    target:
        - nsis
        - zip
    icon: build/app-icons/icon.png
    # The prebuilt binding the package's install script fetched for this
    # platform, next to the build/Release fallback above.  electron-builder
    # expands ${arch} in file patterns; ${platform} names the build host,
    # so each OS block spells out its process.platform value.
    files:
        - "node_modules/@baander/aac-native/prebuilds/win32-${arch}/*.node"

nsis:
    oneClick: false                       # show wizard UI
    perMachine: false                     # set to true to default to "Install for all users"
    allowToChangeInstallationDirectory: true
    createDesktopShortcut: true
    createStartMenuShortcut: true
    artifactName: "${name}-${version}-Setup.${ext}"
    displayLanguageSelector: false
    deleteAppDataOnUninstall: true

mac:
    target:
        - dmg
        - zip
    icon: build/app-icons/icon.png
    files:
        - "node_modules/@baander/aac-native/prebuilds/darwin-${arch}/*.node"

linux:
    target:
        - AppImage
        - deb
    icon: build/app-icons/icon.png
    files:
        - "node_modules/@baander/aac-native/prebuilds/linux-${arch}/*.node"
