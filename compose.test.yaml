services:
    app:
        image: ${BAANDER_TEST_IMAGE:-martinjuul/baander-app:latest}
        user: '0:0'
        working_dir: /var/www/html
        entrypoint: ['sh', '-c']
        command: ['exec sleep infinity']
        privileged: ${BAANDER_TEST_APP_PRIVILEGED:-true}
        healthcheck:
            disable: true
        environment:
            APP_ENV: test
            APP_DEBUG: '0'
            XDEBUG_MODE: ${BAANDER_TEST_XDEBUG_MODE:-off}
            DATABASE_URL: 'postgresql://baander:test-only@postgres:5432/functional_test?serverVersion=18&charset=utf8'
            OUTBOX_TEST_DATABASE_URL: 'postgresql://baander:test-only@postgres:5432/functional_test?serverVersion=18&charset=utf8'
            REDIS_PASSWORD: test-only
            REDIS_URL: 'redis://default:test-only@redis:6379'
            MESSENGER_TEST_REDIS_DSN: 'redis://default:test-only@redis:6379'
            MESSENGER_TRANSPORT_DSN: 'redis://default:test-only@redis:6379/messages'
            OAUTH_PRIVATE_KEY_PATH: /tmp/baander-oauth/private.key
            OAUTH_PUBLIC_KEY_PATH: /tmp/baander-oauth/public.key
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks: [private]
    postgres:
        image: ${BAANDER_TEST_POSTGRES_IMAGE:-baander-database:latest}
        environment:
            POSTGRES_USER: baander
            POSTGRES_PASSWORD: test-only
            POSTGRES_DB: functional_test
        healthcheck:
            test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'baander', '-d', 'functional_test']
            interval: 1s
            timeout: 3s
            retries: 60
        volumes: ['postgres_data:/var/lib/postgresql']
        networks: [private]
    redis:
        image: ${BAANDER_TEST_REDIS_IMAGE:-redis/redis-stack-server:edge}
        environment:
            REDIS_ARGS: '--requirepass test-only'
            REDISCLI_AUTH: test-only
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 1s
            timeout: 3s
            retries: 60
        volumes: ['redis_data:/data']
        networks: [private]
networks:
    private:
        internal: true
volumes:
    postgres_data:
    redis_data:
