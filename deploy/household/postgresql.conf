# Qualification candidate; measured capacity is recorded separately.
listen_addresses = '*'
port = 5432
# Clients reach PostgreSQL through the pooler: 10 application and 4 control
# server connections, 3 direct connections and three superuser slots.
max_connections = 20
superuser_reserved_connections = 3
reserved_connections = 0

shared_buffers = 128MB
work_mem = 4MB
maintenance_work_mem = 64MB
autovacuum_work_mem = 32MB
max_parallel_workers_per_gather = 0
autovacuum = on

shared_preload_libraries = 'pg_stat_statements'

pgroonga.enable_wal = on
pgroonga.max_wal_size = 100MB
