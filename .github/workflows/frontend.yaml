name: Frontend CI

on:
    push:
        branches:
            - master
        paths:
            - 'openapi.json'
            - 'ui/web/**'
            - 'tests/browser/**'
            - 'ui/design-tokens/**'
            - 'ui/shared/**'
            - 'ui/rn/**'
            - 'ui/electron/**'
            - 'packages/baander-audio-core/**'
            - 'scripts/build-wasm.ts'
            - '.github/workflows/frontend.yaml'
    pull_request:
        types: [ opened, synchronize, reopened ]
        paths:
            - 'openapi.json'
            - 'ui/web/**'
            - 'tests/browser/**'
            - 'ui/design-tokens/**'
            - 'ui/shared/**'
            - 'ui/rn/**'
            - 'ui/electron/**'
            - 'packages/baander-audio-core/**'
            - 'scripts/build-wasm.ts'
            - '.github/workflows/frontend.yaml'

env:
    COVERAGE_PACKAGE: coverage-frontend
    CACHE_PACKAGE_YARN: yarn-cache-frontend

permissions:
    contents: read

concurrency:
    group: frontend-ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        permissions:
            contents: read
            # Restores the Yarn cache from Forgejo's package store, and
            # Forgejo may scope its workflow token by these permissions.
            packages: read
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

            -   name: Prepare standalone PHP tooling on Forgejo
                if: github.server_url != 'https://github.com'
                run: composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins

            -   name: Restore yarn cache on Forgejo
                if: github.server_url != 'https://github.com'
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php restore "$CACHE_PACKAGE_YARN" yarn-cache.tar.zst "$HOME/.yarn/berry/cache"

            -   name: Restore yarn cache on GitHub
                if: github.server_url == 'https://github.com'
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: ~/.yarn/berry/cache
                    key: yarn-cache-frontend-${{ github.sha }}
                    restore-keys: yarn-cache-frontend-

            -   name: Install dependencies
                working-directory: ui/web
                run: yarn install --immutable

            -   name: Generated client drift
                working-directory: ui/web
                run: yarn generate:check

            -   name: Web design token checks
                working-directory: ui/design-tokens
                run: |
                    node build.mjs --check
                    node --test tests/*.test.mjs

            -   name: Shared package checks
                working-directory: ui/shared
                run: |
                    yarn install --immutable
                    yarn typecheck
                    yarn test

            -   name: Desktop security checks
                working-directory: ui/electron
                run: |
                    corepack yarn install --immutable
                    corepack yarn tsc
                    corepack yarn test

            -   name: Embedded player checks
                working-directory: ui/web/packages/baander-player
                run: |
                    corepack yarn install --immutable
                    corepack yarn typecheck
                    corepack yarn test

            -   name: Typecheck
                working-directory: ui/web
                run: yarn typecheck

            -   name: Lint
                working-directory: ui/web
                run: yarn lint

    test:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        env:
            # GitHub mounts a home directory owned by the runner user into a job
            # container that runs as root, and Firefox refuses to start there.
            HOME: /root
        permissions:
            contents: read
            # Forgejo may scope its workflow token by these permissions, and
            # the job saves its Yarn cache and coverage baseline as packages.
            packages: write
            pull-requests: write
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

            -   name: Prepare standalone PHP tooling on Forgejo
                if: github.server_url != 'https://github.com'
                run: composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins

            -   name: Restore yarn cache on Forgejo
                if: github.server_url != 'https://github.com'
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php restore "$CACHE_PACKAGE_YARN" yarn-cache.tar.zst "$HOME/.yarn/berry/cache"

            -   name: Restore yarn cache on GitHub
                if: github.server_url == 'https://github.com'
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: ~/.yarn/berry/cache
                    key: yarn-cache-frontend-${{ github.sha }}
                    restore-keys: yarn-cache-frontend-

            -   name: Install dependencies
                working-directory: ui/web
                run: yarn install --immutable

            -   name: Run tests with coverage
                working-directory: ui/web
                run: yarn test:coverage

            -   name: Install browser authentication test runtime
                working-directory: ui/web
                run: yarn exec playwright install --with-deps chromium firefox webkit

            -   name: Native browser authentication transport
                working-directory: ui/web
                run: yarn test:browser-auth

            -   name: Native browser audio graph
                working-directory: ui/web
                run: yarn test:audio-graph

            -   name: Store isolation and debugger browser workflow
                working-directory: ui/web
                run: yarn test:store-debug

            -   name: Typography in Chromium, Firefox and WebKit
                working-directory: ui/web
                run: yarn test:typography

            -   name: Extract coverage metrics
                working-directory: ui/web
                run: |
                    node -e "
                      const s = require('./coverage/coverage-summary.json');
                      const t = s.total;
                      const m = {
                        lines: t.lines.pct,
                        statements: t.statements.pct,
                        branches: t.branches.pct,
                        functions: t.functions.pct
                      };
                      require('fs').writeFileSync('coverage/metrics.json', JSON.stringify(m));
                      console.log('Lines:      ' + m.lines.toFixed(1) + '%');
                      console.log('Statements: ' + m.statements.toFixed(1) + '%');
                      console.log('Branches:   ' + m.branches.toFixed(1) + '%');
                      console.log('Functions:  ' + m.functions.toFixed(1) + '%');
                    "

            -   name: Stage coverage baseline (master only)
                if: github.ref == 'refs/heads/master'
                run: |
                    mkdir -p var/coverage-baseline
                    cp ui/web/coverage/metrics.json var/coverage-baseline/metrics.json

            -   name: Store baseline (master only) on Forgejo
                if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php store "$COVERAGE_PACKAGE" metrics.json var/coverage-baseline/metrics.json

            -   name: Store baseline (master only) on GitHub
                if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: var/coverage-baseline
                    key: coverage-frontend-${{ github.sha }}

            -   name: Restore coverage baseline (PR only) on Forgejo
                if: github.server_url != 'https://github.com' && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php fetch "$COVERAGE_PACKAGE" metrics.json var/coverage-baseline/metrics.json

            -   name: Restore coverage baseline (PR only) on GitHub
                if: github.server_url == 'https://github.com' && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: var/coverage-baseline
                    key: coverage-frontend-${{ github.sha }}
                    restore-keys: coverage-frontend-

            -   name: Post coverage comment (PR only)
                if: github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                working-directory: ui/web
                env:
                    COMMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PR_NUMBER: ${{ github.event.number }}
                run: |
                    # The master baseline; absent until master has stored one.
                    MASTER_JSON=$(cat ../../var/coverage-baseline/metrics.json 2>/dev/null || echo '{}')

                    # Generate comment body
                    COMMENT=$(node -e "
                      const cur = require('./coverage/metrics.json');
                      const mas = $MASTER_JSON;

                      function delta(k) {
                        if (mas[k] === undefined) return '';
                        const d = cur[k] - mas[k];
                        const s = d >= 0 ? '+' : '';
                        const i = d > 0 ? '🟢' : d < 0 ? '🔴' : '⚪';
                        return ' | ' + i + ' ' + s + d.toFixed(1) + '%';
                      }

                      let c = '## 📊 Frontend Coverage\n\n';
                      c += '| Metric | Coverage | Baseline | Change |\n';
                      c += '|--------|----------|----------|--------|\n';
                      for (const k of ['lines','statements','branches','functions']) {
                        const l = k[0].toUpperCase() + k.slice(1);
                        const b = mas[k] !== undefined ? mas[k].toFixed(1) + '%' : '—';
                        c += '| ' + l + ' | **' + cur[k].toFixed(1) + '%** | ' + b + delta(k) + ' |\n';
                      }
                      process.stdout.write(c);
                    ")

                    # Post PR comment
                    ESCAPED=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$COMMENT")
                    HTTP=$(curl -sf -o /dev/null -w '%{http_code}' -X POST \
                      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                      -H "Authorization: token $COMMENT_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"body\": $ESCAPED}")
                    echo "Posted coverage comment (HTTP $HTTP)"

            -   name: Update yarn cache (master only) on Forgejo
                if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php save "$CACHE_PACKAGE_YARN" yarn-cache.tar.zst "$HOME/.yarn/berry/cache"

            -   name: Update yarn cache (master only) on GitHub
                if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: ~/.yarn/berry/cache
                    key: yarn-cache-frontend-${{ github.sha }}

    build:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        needs: [ quality, test ]
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        permissions:
            contents: read
            # Restores the Yarn cache from Forgejo's package store, and
            # Forgejo may scope its workflow token by these permissions.
            packages: read
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

            -   name: Prepare standalone PHP tooling on Forgejo
                if: github.server_url != 'https://github.com'
                run: composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins

            -   name: Restore yarn cache on Forgejo
                if: github.server_url != 'https://github.com'
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php restore "$CACHE_PACKAGE_YARN" yarn-cache.tar.zst "$HOME/.yarn/berry/cache"

            -   name: Restore yarn cache on GitHub
                if: github.server_url == 'https://github.com'
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: ~/.yarn/berry/cache
                    key: yarn-cache-frontend-${{ github.sha }}
                    restore-keys: yarn-cache-frontend-

            -   name: Install dependencies
                working-directory: ui/web
                run: yarn install --immutable

            -   name: Build
                working-directory: ui/web
                run: yarn build

            -   name: Verify output
                working-directory: ui/web
                run: node scripts/verify-build.mjs
