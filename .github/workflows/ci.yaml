name: CI

on:
    push:
        branches:
            - master
    pull_request:
        types: [ opened, synchronize, reopened ]

env:
    REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}
    IMAGE_NAME: ${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander
    POSTGRES_IMAGE: ${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-postgres
    # The application image copies FFmpeg from the static FFmpeg image. GitHub keeps the
    # tooling catalog's reference (empty means unset); Forgejo reads its own registry copy.
    BAANDER_FFMPEG_IMAGE: ${{ github.server_url != 'https://github.com' && format('{0}/{1}/ffmpeg-baander-static:latest', vars.REGISTRY_URL, vars.REGISTRY_OWNER) || '' }}
    COVERAGE_PACKAGE: coverage-backend
    BUILDKIT_CACHE_PACKAGE: buildkit-cache-backend
    CI_IMAGE: baander-ci:${{ github.run_id }}-${{ github.run_attempt }}

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    quality-gate:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        env:
            BAANDER_TEST_DOCKER_SOCKET_PATH: ${{ vars.BAANDER_TEST_DOCKER_SOCKET_PATH || '/var/run/docker.sock' }}
            CI_BUILDER: baander-ci-${{ github.run_id }}-${{ github.run_attempt }}
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        permissions:
            contents: read
            # Forgejo may scope its workflow token by these permissions, and
            # the job saves its BuildKit cache and coverage baseline as packages.
            packages: write
            pull-requests: write
        steps:
            -   name: Free host disk on GitHub
                # The hosted runner ships toolchains this job never uses. The
                # job runs in a container, so a sibling container removes them
                # from the host through the Docker socket. On a self-hosted
                # runner this would delete host directories, so it runs on
                # GitHub only.
                if: github.server_url == 'https://github.com'
                run: |
                    docker run --rm \
                      -v /usr/share/dotnet:/cleanup/dotnet \
                      -v /usr/local/lib/android:/cleanup/android \
                      -v /opt/ghc:/cleanup/ghc \
                      -v /opt/hostedtoolcache:/cleanup/hostedtoolcache \
                      -v /:/host:ro \
                      --entrypoint /bin/sh \
                      "$REGISTRY/${IMAGE_NAME%/*}/baander-runner:latest" \
                      -c 'find /cleanup -mindepth 2 -delete; df -h /host'

            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

            -   name: Prepare standalone PHP tooling
                run: composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins

            -   name: Login to Container Registry
                if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
                env:
                    REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN || github.token }}
                run: printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

            -   name: Pull PostgreSQL image
                run: docker pull ${{ env.REGISTRY }}/${{ env.POSTGRES_IMAGE }}:latest

            -   name: Pull fixture images
                run: |
                    for role in fixtureRedis mailpit; do
                        docker pull "$(php -r 'require "scripts/bootstrap.php"; echo \Baander\Tooling\Configuration\ToolingConfiguration::forRepository(getcwd(), getenv())->images->role($argv[1])->reference;' "$role")"
                    done

            -   name: Restore BuildKit cache on Forgejo
                if: github.server_url != 'https://github.com'
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php restore "$BUILDKIT_CACHE_PACKAGE" buildkit-cache.tar.zst /tmp/buildkit-cache

            -   name: Restore BuildKit cache on GitHub
                if: github.server_url == 'https://github.com'
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: /tmp/buildkit-cache
                    key: buildkit-cache-backend-${{ github.sha }}
                    restore-keys: buildkit-cache-backend-

            -   name: Docker build context contract
                run: bash scripts/test-docker-context.sh

            -   name: Build movie player for full-stack playback
                working-directory: ui/web
                run: |
                    corepack yarn install --immutable
                    corepack yarn build
                    node scripts/verify-build.mjs

            -   name: Prepare BuildKit container builder
                # The Docker driver exports a local build cache only with the
                # containerd image store, which GitHub's hosted Docker lacks.
                # This builder runs its BuildKit container on the job's own
                # daemon; the build loads its images back into that daemon.
                # The name is unique to the run and removed when the job ends.
                # The BuildKit image is pinned by digest like every other image.
                run: |
                    docker buildx create --name "$CI_BUILDER" --driver docker-container \
                      --driver-opt image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe

            -   name: Build CI image
                run: |
                    php scripts/build-application.php --buildx --builder "$CI_BUILDER" \
                      --target ci --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                      --tag "$CI_IMAGE" \
                      --cache-to type=local,dest=/tmp/buildkit-cache-new,mode=max \
                      --cache-from type=local,src=/tmp/buildkit-cache

            -   name: Replace BuildKit cache with this build's export
                # The local cache exporter does not remove blobs it finds in its
                # destination, so exporting over the restored cache would grow
                # it on every save. The later build and the saves use only
                # what this build exported.
                run: rm -rf /tmp/buildkit-cache && mv /tmp/buildkit-cache-new /tmp/buildkit-cache

            -   name: Xdebug runtime contract
                run: BAANDER_TEST_IMAGE="$CI_IMAGE" bash scripts/test-dev-xdebug-container.sh

            -   name: Browser frame capture and video replacement evidence
                run: >-
                    node --test
                    ui/web/tests/e2e/transcode-adaptive/frame-observer.test.mjs
                    ui/web/tests/e2e/transcode-adaptive/video-cancellation.test.mjs

            -   name: Progressive DASH browser completion
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      bash scripts/test-transcode-publication-browser.sh

            -   name: Automatic movie quality switching with AAC and Opus
                run: |
                    for profile in streaming_stereo opus_stereo; do
                      BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      BAANDER_TEST_AUDIO_PROFILE="$profile" \
                      BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/transcode-adaptive-$profile" \
                        bash scripts/test-transcode-adaptive-browser.sh || exit "$?"
                    done

            -   name: Sparse movie playback and source seeking
                run: |
                    for scenario in sparse-fresh sparse-seek; do
                      BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      BAANDER_TEST_VIDEO_SCENARIO="$scenario" \
                      BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/transcode-$scenario" \
                        bash scripts/test-transcode-adaptive-browser.sh || exit "$?"
                    done

            -   name: Matroska movie origins, delayed audio and subtitles
                run: |
                    for scenario in matroska-delayed-fresh matroska-delayed-seek; do
                      BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      BAANDER_TEST_VIDEO_SCENARIO="$scenario" \
                      BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/transcode-$scenario" \
                        bash scripts/test-transcode-adaptive-browser.sh || exit "$?"
                    done

            -   name: Ordinary movie delayed audio and source seeking
                run: |
                    for scenario in ordinary-delayed-fresh ordinary-delayed-seek; do
                      BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      BAANDER_TEST_VIDEO_SCENARIO="$scenario" \
                      BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/transcode-$scenario" \
                        bash scripts/test-transcode-adaptive-browser.sh || exit "$?"
                    done

            -   name: Source default audio and source seeking
                run: |
                    for scenario in default-audio-fresh default-audio-seek; do
                      BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      BAANDER_TEST_VIDEO_SCENARIO="$scenario" \
                      BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/transcode-$scenario" \
                        bash scripts/test-transcode-adaptive-browser.sh || exit "$?"
                    done

            -   name: Movie playback through silent audio tails
                run: |
                    for scenario in short-audio-fresh short-audio-seek; do
                      BAANDER_TEST_IMAGE="$CI_IMAGE" \
                      BAANDER_TEST_VIDEO_SCENARIO="$scenario" \
                      BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/transcode-$scenario" \
                        bash scripts/test-transcode-adaptive-browser.sh || exit "$?"
                    done

            -   name: Build production worker image
                run: |
                    php scripts/build-application.php --buildx --builder "$CI_BUILDER" --target worker \
                      --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                      --tag "${CI_IMAGE}-worker" \
                      --cache-from type=local,src=/tmp/buildkit-cache

            -   name: Collect and verify worker packaged inventory
                run: |
                    bash scripts/collect-packaged-inventory.sh \
                      --image "${CI_IMAGE}-worker" --target worker \
                      --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                      --output var/test-runs/application-inventory-worker

            -   name: Production worker lifecycle and dependencies
                run: |
                    BAANDER_TEST_IMAGE="${CI_IMAGE}-worker" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                      bash scripts/test-worker-production-container.sh

            -   name: Independent web and worker media ownership in Chromium
                run: |
                    BAANDER_TEST_IMAGE="${CI_IMAGE}-worker" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_BROWSER_ENGINE=chromium \
                    BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/two-command-chromium" \
                    BAANDER_TEST_BROWSER_CLIENT_CONTROLS=1 \
                    BAANDER_TEST_TWO_COMMAND_CHECKPOINT="$PWD/scripts/test-two-command-browser-checkpoint.sh" \
                      bash scripts/test-two-command-deployment-container.sh

            -   name: Selected video endpoint through movie completion and replay
                run: |
                    BAANDER_TEST_IMAGE="${CI_IMAGE}-worker" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_BROWSER_ENGINE=chromium \
                    BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/movie-endpoint-chromium" \
                      bash scripts/test-movie-endpoint-browser.sh

            -   name: Independent web and worker media ownership in Firefox
                run: |
                    BAANDER_TEST_IMAGE="${CI_IMAGE}-worker" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_BROWSER_ENGINE=firefox \
                    BAANDER_TEST_ARTIFACTS="$PWD/var/test-runs/two-command-firefox" \
                    BAANDER_TEST_BROWSER_CLIENT_CONTROLS=1 \
                    BAANDER_TEST_TWO_COMMAND_CHECKPOINT="$PWD/scripts/test-two-command-browser-checkpoint.sh" \
                      bash scripts/test-two-command-deployment-container.sh

            -   name: Composer platform requirements
                run: docker run --rm "$CI_IMAGE" composer check-platform-reqs

            -   name: PHPStan
                run: |
                    docker run --rm -e XDEBUG_MODE=off \
                      "$CI_IMAGE" \
                      php ./vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            -   name: OpenAPI drift
                run: |
                    docker run --rm "$CI_IMAGE" \
                      php bin/console app:export-openapi-spec --env=test --no-debug --check

            -   name: Deptrac
                run: |
                    docker run --rm "$CI_IMAGE" vendor/bin/deptrac analyse --no-cache --no-progress

            -   name: Docker Compose availability
                run: docker compose version

            -   name: Backend runner regressions
                run: |
                    docker run --rm --network none --entrypoint php "$CI_IMAGE" \
                      vendor/bin/phpunit --configuration phpunit-tooling.xml.dist scripts/tests/php/RetainBuildEvidenceTest.php
                    docker run --rm --network none --entrypoint php "$CI_IMAGE" \
                      vendor/bin/phpunit --configuration phpunit-tooling.xml.dist scripts/tests/php/WorkerCleanupTest.php

            -   name: PHP tooling regressions
                run: |
                    docker run --rm --network none "$CI_IMAGE" \
                      composer check:js-dependencies:local
                    docker run --rm --network none "$CI_IMAGE" \
                      composer run-script --timeout=720 check:php-dependencies:local
                    docker run --rm --network none "$CI_IMAGE" \
                      composer check:tooling-architecture
                    docker run --rm --network none "$CI_IMAGE" \
                      composer check:tooling-format
                    docker run --rm --network none -e XDEBUG_MODE=off "$CI_IMAGE" \
                      php vendor/bin/phpunit --configuration phpunit-tooling.xml.dist --exclude-group registry-python-subject
                    docker run --rm --network none -e XDEBUG_MODE=off -e REGISTRY_SUBJECT_PYTHON=/usr/bin/python3 "$CI_IMAGE" \
                      php vendor/bin/phpunit --configuration phpunit-tooling.xml.dist --group registry-python-subject
                    docker run --rm --network none -e XDEBUG_MODE=off "$CI_IMAGE" \
                      php vendor/bin/phpstan analyse --configuration phpstan-tooling.neon --memory-limit=1G --no-progress

            -   name: Python-free workflow contracts
                run: |
                    TOOLING_IMAGE="baander-tooling:${{ github.run_id }}-${{ github.run_attempt }}"
                    docker build --target tooling --file docker/runner/Dockerfile \
                      --tag "$TOOLING_IMAGE" .
                    docker build --file docker/runner/tooling-test.Dockerfile \
                      --build-arg APP_HOME="$(php -r 'require "scripts/bootstrap.php"; echo Baander\Tooling\Configuration\ApplicationLayout::load()->root;')" \
                      --build-arg CI_IMAGE="$CI_IMAGE" \
                      --build-arg TOOLING_IMAGE="$TOOLING_IMAGE" .

            -   name: Development instance safety and source admission
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                      bash scripts/test-dev-environment-container.sh --components-only

            -   name: Backend stack isolation
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                      php scripts/test-backend-stack-isolation.php --artifacts var/test-isolation

            -   name: PHPUnit with coverage
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      bash scripts/test-backend-container.sh \
                      --coverage-text=coverage/report.txt --coverage-clover=coverage/clover.xml

            -   name: Messenger without Swoole
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                    BAANDER_TEST_DISABLE_SWOOLE=1 \
                      bash scripts/test-backend-container.sh \
                      tests/Fixtures/MessengerWithoutSwooleTest.php \
                      tests/Unit/Shared/Infrastructure/Messenger/SwooleFallbackHandlerRegistrationTest.php \
                      tests/Integration/MessengerJsonDeliveryTest.php \
                      tests/Integration/MessengerAdmissionLifecycleTest.php

            -   name: Container startup contract
                run: bash scripts/test-container-startup.sh

            -   name: Legacy transport redelivery recovery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 300 bash scripts/test-worker-runtime-container.sh

            -   name: Worker command lifecycle and delivery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      bash scripts/test-worker-command-container.sh

            -   name: Worker deployment operator lifecycle
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                    BAANDER_TEST_OPERATOR_IN_CONTAINER=1 \
                      bash scripts/test-worker-operator-container.sh

            -   name: Standalone worker dependency outages and recovery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                    BAANDER_TEST_OPERATOR_IN_CONTAINER=1 \
                      bash scripts/test-worker-lifecycle-container.sh

            -   name: Outbox notification replay
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 180 bash scripts/test-outbox-runtime-container.sh

            -   name: Producer transaction rollback and recovery
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 180 bash scripts/test-producer-runtime-container.sh

            -   name: Web server mail language, audio streaming and health alerts
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 180 bash scripts/test-web-runtime-container.sh

            -   name: Application security runtime boundaries
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      bash scripts/test-security-runtime-container.sh

            -   name: WebSocket proxy credential logging
                run: |
                    docker build -f docker/nginx/Dockerfile.test -t "${CI_IMAGE}-proxy" docker/nginx
                    BAANDER_TEST_PROXY_IMAGE="${CI_IMAGE}-proxy" bash scripts/test-websocket-proxy-logs.sh

            -   name: Web server drain on stop (PID 1)
                run: |
                    BAANDER_TEST_IMAGE="$CI_IMAGE" \
                    BAANDER_TEST_POSTGRES_IMAGE="$REGISTRY/$POSTGRES_IMAGE:latest" \
                    BAANDER_TEST_CHECKOUT_IN_IMAGE=1 \
                      timeout 900 bash scripts/test-web-shutdown-container.sh

            -   name: Extract coverage metrics
                run: php scripts/validate-backend-coverage.php coverage

            -   name: Preserve backend verification artifacts on GitHub
                if: always() && github.server_url == 'https://github.com'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: backend-verification
                    path: |
                        var/test-runs/
                        var/test-isolation/
                        coverage/
                    if-no-files-found: ignore
                    retention-days: 14

            -   name: Preserve backend verification artifacts on Forgejo
                if: always() && github.server_url != 'https://github.com'
                uses: ./.github/actions/forgejo-upload-artifact
                with:
                    name: backend-verification
                    path: |
                        var/test-runs/
                        var/test-isolation/
                        coverage/
                    if-no-files-found: ignore
                    retention-days: 14

            -   name: Stage coverage baseline (master only)
                if: github.ref == 'refs/heads/master'
                run: |
                    mkdir -p var/coverage-baseline
                    cp coverage/metrics.json var/coverage-baseline/metrics.json

            -   name: Store baseline (master only) on Forgejo
                if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                continue-on-error: true
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php store "$COVERAGE_PACKAGE" metrics.json var/coverage-baseline/metrics.json

            -   name: Store baseline (master only) on GitHub
                if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: var/coverage-baseline
                    key: coverage-backend-${{ github.sha }}

            -   name: Save BuildKit cache (master only) on Forgejo
                if: github.server_url != 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php save "$BUILDKIT_CACHE_PACKAGE" buildkit-cache.tar.zst /tmp/buildkit-cache

            -   name: Save BuildKit cache (master only) on GitHub
                if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: /tmp/buildkit-cache
                    key: buildkit-cache-backend-${{ github.sha }}

            -   name: Restore coverage baseline (PR only) on Forgejo
                if: github.server_url != 'https://github.com' && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                env:
                    FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: php scripts/ci-package-store.php fetch "$COVERAGE_PACKAGE" metrics.json var/coverage-baseline/metrics.json

            -   name: Restore coverage baseline (PR only) on GitHub
                if: github.server_url == 'https://github.com' && github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
                with:
                    path: var/coverage-baseline
                    key: coverage-backend-${{ github.sha }}
                    restore-keys: coverage-backend-

            -   name: Post coverage comment (PR only)
                if: github.event_name == 'pull_request' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                env:
                    COMMENT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    PR_NUMBER: ${{ github.event.number }}
                run: |
                    MASTER_JSON=$(cat var/coverage-baseline/metrics.json 2>/dev/null || echo '{}')

                    COMMENT=$(node -e "
                      const cur = require('./coverage/metrics.json');
                      const mas = $MASTER_JSON;

                      function delta(k) {
                        if (mas[k] === undefined) return '';
                        const d = cur[k] - mas[k];
                        const s = d >= 0 ? '+' : '';
                        const i = d > 0 ? '🟢' : d < 0 ? '🔴' : '⚪';
                        return ' | ' + i + ' ' + s + d.toFixed(1) + '%';
                      }

                      let c = '## 📊 Backend Coverage\n\n';
                      c += '| Metric | Coverage | Baseline | Change |\n';
                      c += '|--------|----------|----------|--------|\n';
                      for (const k of ['lines','methods','classes']) {
                        const l = k[0].toUpperCase() + k.slice(1);
                        const b = mas[k] !== undefined ? mas[k].toFixed(1) + '%' : '—';
                        c += '| ' + l + ' | **' + cur[k].toFixed(1) + '%** | ' + b + delta(k) + ' |\n';
                      }
                      process.stdout.write(c);
                    ")

                    ESCAPED=$(node -e "process.stdout.write(JSON.stringify(process.argv[1]))" "$COMMENT")
                    HTTP=$(curl -sf -o /dev/null -w '%{http_code}' -X POST \
                      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
                      -H "Authorization: token $COMMENT_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "{\"body\": $ESCAPED}")
                    echo "Posted backend coverage comment (HTTP $HTTP)"

            -   name: Cleanup images
                if: always()
                run: |
                    docker image rm "$CI_IMAGE" "${CI_IMAGE}-worker" 2>/dev/null || true

            -   name: Remove BuildKit container builder
                # Each run creates its own builder, so concurrent jobs on a
                # shared self-hosted daemon never share or race for one.
                if: always()
                run: docker buildx rm "$CI_BUILDER" 2>/dev/null || true

    frontend-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        env:
            # GitHub mounts a home directory owned by the runner user into a job
            # container that runs as root, and Firefox refuses to start there.
            HOME: /root
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Shared checks
                working-directory: ui/shared
                run: |
                    yarn install --immutable
                    yarn typecheck
                    yarn test
            -   name: Embedded player checks
                working-directory: ui/web/packages/baander-player
                run: |
                    corepack yarn install --immutable
                    corepack yarn typecheck
                    corepack yarn test
            -   name: Web checks
                working-directory: ui/web
                run: |
                    yarn install --immutable
                    yarn generate:check
                    yarn lint
                    yarn test
                    yarn build
                    node scripts/verify-build.mjs
            -   name: Install browser test runtime
                working-directory: ui/web
                run: yarn exec playwright install --with-deps chromium firefox webkit
            -   name: Native browser authentication transport
                working-directory: ui/web
                run: yarn test:browser-auth
            -   name: Native browser audio graph
                working-directory: ui/web
                run: yarn test:audio-graph
            -   name: Store isolation and debugger browser workflow
                working-directory: ui/web
                run: yarn test:store-debug

    dsp-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Install pinned Emscripten
                run: |
                    git init -q /tmp/baander-dsp-emsdk
                    git -C /tmp/baander-dsp-emsdk remote add origin https://github.com/emscripten-core/emsdk.git
                    git -C /tmp/baander-dsp-emsdk fetch -q --depth 1 origin db04e88298d9916fc51fcd3743045ca3eb695127
                    git -C /tmp/baander-dsp-emsdk checkout -q --detach FETCH_HEAD
                    /tmp/baander-dsp-emsdk/emsdk install 6.0.3
                    /tmp/baander-dsp-emsdk/emsdk activate 6.0.3
            -   name: Build and qualify analysis modules
                shell: bash
                run: |
                    . /tmp/baander-dsp-emsdk/emsdk_env.sh
                    bash scripts/test-dsp-analysis.sh

    registry-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        timeout-minutes: 30
        strategy:
            matrix:
                mode: [ release, sanitize ]
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
            options: --tmpfs /run/baander-registry-full-disk:rw,noexec,nosuid,nodev,size=128m,mode=0700
        env:
            REGISTRY_FULL_DISK_ROOT: /run/baander-registry-full-disk
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Prepare standalone PHP tooling
                run: |
                    composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins
                    composer --working-dir=relay install --no-dev --no-interaction --no-scripts --no-plugins
            -   name: Install native test tools
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends ninja-build openssl
            -   name: Build and qualify registry
                run: REGISTRY_SUBJECT_PYTHON=/usr/bin/python3 bash scripts/test-registry.sh ${{ matrix.mode }}

    registry-static-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        timeout-minutes: 30
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Prepare standalone PHP tooling
                run: |
                    composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins
                    composer --working-dir=relay install --no-dev --no-interaction --no-scripts --no-plugins
            -   name: Install static analysis toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends clang-19 clang-tidy-19 ninja-build
            -   name: Analyze registry and verify direct dependency licenses
                run: bash scripts/test-registry-static.sh

    registry-container-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        timeout-minutes: 45
        env:
            REGISTRY_INVENTORY_OUTPUT: var/test-runs/registry-inventory
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Prepare standalone PHP tooling
                run: |
                    composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins
                    composer --working-dir=relay install --no-dev --no-interaction --no-scripts --no-plugins
            -   name: Install container test tools
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends openssl
            -   name: Build and qualify registry containers
                run: bash scripts/test-registry-container.sh
            -   name: Qualify encrypted registry backup and recovery
                run: bash scripts/test-registry-backup.sh
            -   name: Preserve packaged Registry inventories on GitHub
                if: always() && github.server_url == 'https://github.com'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: registry-packaged-inventory
                    path: var/test-runs/registry-inventory/
                    if-no-files-found: error
                    retention-days: 14

            -   name: Preserve packaged Registry inventories on Forgejo
                if: always() && github.server_url != 'https://github.com'
                uses: ./.github/actions/forgejo-upload-artifact
                with:
                    name: registry-packaged-inventory
                    path: var/test-runs/registry-inventory/
                    if-no-files-found: error
                    retention-days: 14

    # ThreadSanitizer re-executes the tests with address randomization off; the
    # Ubuntu 26.04 runner refuses that personality() call, so this job stays on
    # 24.04 until it allows it.
    registry-thread-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-24.04' || 'docker-cli' }}
        timeout-minutes: 30
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Prepare standalone PHP tooling
                run: |
                    composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins
                    composer --working-dir=relay install --no-dev --no-interaction --no-scripts --no-plugins
            -   name: Install thread sanitizer toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends python3 openssl clang-19 libclang-rt-19-dev ninja-build
            -   name: Build and qualify registry threads
                env:
                    CC: clang-19
                    CXX: clang++-19
                run: REGISTRY_SUBJECT_PYTHON=/usr/bin/python3 bash scripts/test-registry.sh thread

    registry-fuzz-quality:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        timeout-minutes: 45
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Prepare standalone PHP tooling
                run: |
                    composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins
                    composer --working-dir=relay install --no-dev --no-interaction --no-scripts --no-plugins
            -   name: Install parser fuzz toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends python3 openssl clang-19 libclang-rt-19-dev ninja-build
            -   name: Fuzz registry parser and registration validation
                env:
                    CC: clang-19
                    CXX: clang++-19
                run: REGISTRY_SUBJECT_PYTHON=/usr/bin/python3 bash scripts/test-registry.sh fuzz

    build-and-push:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        needs: [ quality-gate, frontend-quality, dsp-quality, registry-quality, registry-container-quality, registry-thread-quality, registry-fuzz-quality, registry-static-quality ]
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Free host disk on GitHub
                # See the quality gate; the production build needs the space too.
                if: github.server_url == 'https://github.com'
                run: |
                    docker run --rm \
                      -v /usr/share/dotnet:/cleanup/dotnet \
                      -v /usr/local/lib/android:/cleanup/android \
                      -v /opt/ghc:/cleanup/ghc \
                      -v /opt/hostedtoolcache:/cleanup/hostedtoolcache \
                      -v /:/host:ro \
                      --entrypoint /bin/sh \
                      "$REGISTRY/${IMAGE_NAME%/*}/baander-runner:latest" \
                      -c 'find /cleanup -mindepth 2 -delete; df -h /host'

            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

            -   name: Prepare standalone PHP tooling
                run: composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins

            -   name: Login to Container Registry
                if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
                env:
                    REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN || github.token }}
                run: printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

            -   name: Build production image
                run: |
                    php scripts/build-application.php --buildx \
                      --target production \
                      --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                      --tag "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
                      --tag "$REGISTRY/$IMAGE_NAME:latest"

            -   name: Collect and verify production packaged inventory
                run: |
                    bash scripts/collect-packaged-inventory.sh \
                      --image "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" --target production \
                      --revision "${{ github.event.pull_request.head.sha || github.sha }}" \
                      --output var/test-runs/application-inventory-production

            -   name: Push verified production image
                if: github.ref == 'refs/heads/master' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
                run: |
                    OUTPUT=var/test-runs/application-inventory-production
                    docker push "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" > "$OUTPUT/push-revision.log" 2>&1
                    cat "$OUTPUT/push-revision.log"
                    docker image inspect "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" > "$OUTPUT/published-image-inspect.json"
                    docker push "$REGISTRY/$IMAGE_NAME:latest" > "$OUTPUT/push-latest.log" 2>&1
                    cat "$OUTPUT/push-latest.log"

            -   name: Application image is not publicly pullable
                # GHCR keeps the package private until an operator changes
                # it; the image may not be redistributed yet.
                if: github.server_url == 'https://github.com' && github.ref == 'refs/heads/master'
                run: sh scripts/ghcr-private-probe.sh "$REGISTRY/$IMAGE_NAME"

            -   name: Preserve production packaged inventory on GitHub
                if: always() && github.server_url == 'https://github.com'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: application-packaged-inventory-production
                    path: var/test-runs/application-inventory-production/
                    if-no-files-found: ignore
                    retention-days: 14

            -   name: Preserve production packaged inventory on Forgejo
                if: always() && github.server_url != 'https://github.com'
                uses: ./.github/actions/forgejo-upload-artifact
                with:
                    name: application-packaged-inventory-production
                    path: var/test-runs/application-inventory-production/
                    if-no-files-found: ignore
                    retention-days: 14
