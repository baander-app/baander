name: Build FFmpeg Image

on:
    push:
        branches: [ master ]
        paths:
            - 'packages/baander-audio-core/**'
            - 'docker/ffmpeg/**'
            - 'scripts/ffmpeg-capability-gate.sh'
            - '.github/workflows/ffmpeg.yaml'
    workflow_dispatch:

env:
    REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}
    IMAGE_NAME: ${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/ffmpeg-baander-static

permissions:
    contents: read

concurrency:
    group: ffmpeg-image-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        timeout-minutes: 300
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        permissions:
            contents: read
            packages: write
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin ${{ github.ref }}
                    git checkout -q FETCH_HEAD

            -   name: Free host disk on GitHub
                # The static FFmpeg build compiles a large dependency set; the
                # hosted runner's unused toolchains make room for it, removed
                # through the Docker socket by a sibling container. On a
                # self-hosted runner this would delete host directories, so it
                # runs on GitHub only.
                if: github.server_url == 'https://github.com'
                run: |
                    docker run --rm \
                      -v /usr/share/dotnet:/cleanup/dotnet \
                      -v /usr/local/lib/android:/cleanup/android \
                      -v /opt/ghc:/cleanup/ghc \
                      -v /opt/hostedtoolcache:/cleanup/hostedtoolcache \
                      -v /:/host:ro \
                      --entrypoint /bin/sh \
                      "$REGISTRY/${IMAGE_NAME%/*}/baander-runner:latest" \
                      -c 'find /cleanup -mindepth 2 -delete; df -h /host'

            -   name: Login to Container Registry
                if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
                env:
                    REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN || github.token }}
                run: printf '%s\n' "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

            -   name: Build and push FFmpeg image
                run: |
                    docker buildx build \
                      --progress=plain \
                      --file docker/ffmpeg/Dockerfile \
                      --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
                      --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                      --push \
                      .
