name: Public website

on:
    push:
        branches:
            - master
        paths:
            - 'docs-book/**'
            - 'ui/site/**'
            - 'tests/browser/**'
            - 'ui/design-tokens/**'
            - 'ui/web/public/*.svg'
            - 'packages/baander-tooling/**'
            - 'packages/baander-aac/**'
            - 'ui/electron/src/**'
            - 'scripts/build-website.php'
            - 'scripts/website-router.php'
            - 'scripts/bootstrap.php'
            - 'scripts/composer.*'
            - 'composer.*'
            - 'Makefile'
            - 'docker/runner/Dockerfile'
            - '.github/workflows/website.yaml'
            - '.github/actions/**'
    pull_request:
        types: [ opened, synchronize, reopened ]
        paths:
            - 'docs-book/**'
            - 'ui/site/**'
            - 'tests/browser/**'
            - 'ui/design-tokens/**'
            - 'ui/web/public/*.svg'
            - 'packages/baander-tooling/**'
            - 'packages/baander-aac/**'
            - 'ui/electron/src/**'
            - 'scripts/build-website.php'
            - 'scripts/website-router.php'
            - 'scripts/bootstrap.php'
            - 'scripts/composer.*'
            - 'composer.*'
            - 'Makefile'
            - 'docker/runner/Dockerfile'
            - '.github/workflows/website.yaml'
            - '.github/actions/**'

permissions:
    contents: read

concurrency:
    group: website-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    website:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

            -   name: Check website PHP runtime
                run: php -r 'if (PHP_VERSION_ID < 80500 || !extension_loaded("dom") || !extension_loaded("mbstring") || !extension_loaded("tokenizer")) { throw new RuntimeException("Website builds require PHP 8.5, DOM, mbstring and tokenizer."); }'

            -   name: Install standalone PHP tooling
                run: composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins

            -   name: Install site dependencies
                working-directory: ui/site
                run: corepack yarn install --immutable

            -   name: Check shared design tokens
                working-directory: ui/design-tokens
                run: |
                    node build.mjs --check
                    node --test tests/*.test.mjs

            -   name: Install browser runtime
                working-directory: ui/site
                run: corepack yarn playwright install --with-deps chromium

            -   name: Check code and diagram rendering
                working-directory: ui/site
                run: node --test scripts/*.test.mjs

            -   name: Build and validate static website
                run: php scripts/build-website.php

            -   name: Verify static website in Chromium
                working-directory: ui/site
                run: corepack yarn test:browser

            -   name: Archive verified website
                run: |
                    tar -czf var/website.tar.gz -C var/website .
                    sha256sum var/website.tar.gz > var/website.tar.gz.sha256

            -   name: Retain verified website on GitHub
                if: github.server_url == 'https://github.com'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: public-website-${{ github.sha }}
                    path: |
                        var/website.tar.gz
                        var/website.tar.gz.sha256
                    if-no-files-found: error
                    retention-days: 14

            -   name: Retain verified website on Forgejo
                if: github.server_url != 'https://github.com'
                uses: ./.github/actions/forgejo-upload-artifact
                with:
                    name: public-website-${{ github.sha }}
                    path: |
                        var/website.tar.gz
                        var/website.tar.gz.sha256
                    if-no-files-found: error
                    retention-days: 14
