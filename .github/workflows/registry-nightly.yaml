name: Registry nightly qualification

on:
    schedule:
        - cron: '17 2 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: registry-nightly-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    qualify:
        runs-on: ${{ github.server_url == 'https://github.com' && 'ubuntu-latest' || 'docker-cli' }}
        timeout-minutes: 45
        container:
            image: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || vars.REGISTRY_URL }}/${{ github.server_url == 'https://github.com' && 'baander-app' || vars.REGISTRY_OWNER }}/baander-runner:latest
            options: --init
        steps:
            -   name: Checkout
                env:
                    GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    if [ "$GITHUB_SERVER_URL" = https://github.com ]; then
                        auth="basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')"
                    else
                        auth="token $GIT_TOKEN"
                    fi
                    git config --global --add safe.directory "$PWD"
                    git init -q
                    git remote add origin ${{ github.event.repository.clone_url }}
                    git -c http.extraHeader="Authorization: $auth" fetch -q origin "${{ github.event.pull_request.head.sha || github.sha }}"
                    git checkout -q --detach "${{ github.event.pull_request.head.sha || github.sha }}"
                    test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
            -   name: Prepare standalone PHP tooling
                run: |
                    composer --working-dir=scripts install --no-dev --no-interaction --no-scripts --no-plugins
                    composer --working-dir=relay install --no-dev --no-interaction --no-scripts --no-plugins
            -   name: Install parser fuzz toolchain
                run: |
                    apt-get update
                    apt-get install -y --no-install-recommends python3 openssl clang-19 libclang-rt-19-dev ninja-build
            -   name: Qualify five-voter Registry
                env:
                    CC: clang-19
                    CXX: clang++-19
                    REGISTRY_CLUSTER_NODES: '5'
                    REGISTRY_FUZZ_RUNS: '10000'
                    REGISTRY_FUZZ_SECONDS: '120'
                    REGISTRY_QUALIFICATION_OUTPUT: var/test-runs/registry-nightly/${{ github.run_id }}-${{ github.run_attempt }}
                run: REGISTRY_SUBJECT_PYTHON=/usr/bin/python3 bash scripts/test-registry.sh fuzz
            -   name: Preserve nightly qualification evidence on GitHub
                if: always() && github.server_url == 'https://github.com'
                uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
                with:
                    name: registry-nightly-${{ github.run_id }}-${{ github.run_attempt }}
                    path: var/test-runs/registry-nightly/${{ github.run_id }}-${{ github.run_attempt }}
                    if-no-files-found: error
                    retention-days: 14

            -   name: Preserve nightly qualification evidence on Forgejo
                if: always() && github.server_url != 'https://github.com'
                uses: ./.github/actions/forgejo-upload-artifact
                with:
                    name: registry-nightly-${{ github.run_id }}-${{ github.run_attempt }}
                    path: var/test-runs/registry-nightly/${{ github.run_id }}-${{ github.run_attempt }}
                    if-no-files-found: error
                    retention-days: 14
