[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
minfds = 10000

; Processes share the generated container cache. Cleanup belongs in
; start-supervisor.sh, before any child starts.
[program:swoole]
command=/usr/local/bin/php /var/www/html/bin/console swoole:server:run
directory=/var/www/html
process_name=%(program_name)s
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=15
killasgroup=true
stopasgroup=true
stdout_logfile=/tmp/swoole.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/swoole.err.log
stderr_logfile_maxbytes=0

[program:messenger-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /var/www/html/bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --limit=1000 --no-interaction
directory=/var/www/html
environment=MESSENGER_CONSUMER_NAME="%(ENV_HOSTNAME)s-async-%(process_num)02d"
numprocs=1
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:outbox-worker]
command=/usr/local/bin/php /var/www/html/bin/console app:outbox:consume --time-limit=3600 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
startsecs=1
startretries=10
stopsignal=TERM
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
