[supervisord]
nodaemon = true
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid
minfds = 10000

; Swoole HTTP server — the application entrypoint.
;
; Supervised (not launched ad-hoc) so `docker compose restart app` reliably
; restarts the Swoole master process. This matters because OPcache keeps the
; compiled Symfony DI container class in the master's shared memory; if the
; cache dir is wiped while the master lives, the stale class survives and
; references proxy files (e.g. getMidStreamMonitorService__Overridden.php)
; that no longer exist — breaking proxified/pooled services like the logger,
; which silently kills the transcode encoding loop on its first log call.
;
; The cache-clear prefix ensures a stale container can never outlive a
; restart: the DI cache is rebuilt from scratch on every launch. With
; opcache.validate_timestamps=1 this is safe and cheap in dev.
[program:swoole]
command=sh -c "rm -rf /var/www/html/var/cache/dev/* && cd /var/www/html && php bin/console swoole:server:run"
process_name=%(program_name)s
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopwaitsecs=15
killasgroup=true
stopasgroup=true
stdout_logfile=/tmp/swoole.log
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/swoole.err.log
stderr_logfile_maxbytes=0

;[program:messenger-worker]
;process_name=%(program_name)s_%(process_num)02d
;command=/usr/local/bin/php /var/www/html/bin/console messenger:consume async --time-limit=3600 --memory-limit=256M --limit=1000
;numprocs=2
;autostart=true
;autorestart=true
;user=www-data
;group=www-data
;stdout_logfile=/dev/fd/1
;stdout_logfile_maxbytes=0
;stderr_logfile=/dev/fd/2
;stderr_logfile_maxbytes=0
