# Signed delivery URLs and WebSocket credentials travel in the query string, so the access
# logs carry the path alone ($uri) and no referrer, which can hold such a URL as well.
log_format websocket '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time $upstream_status';
log_format path '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent "$http_user_agent"';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# This server listens on plain HTTP behind the TLS-terminating proxy: pass on the
# scheme that proxy reported, and this server's own only when it sent none.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream upstream_backend_php {
    server app:9501;
    keepalive 64;
}

# Production: HTTP only.
# Sits behind an external reverse proxy (Traefik, nginx, Cloudflare, etc.)
# that handles TLS termination and forwards plain HTTP here.
server {
    listen 80;
    server_name _;

    charset utf-8;
    server_tokens off;

    # Trust X-Forwarded-* headers from the upstream reverse proxy
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Media uploads (audio, video, images) can be up to 100MB
    client_max_body_size 100m;

    access_log /var/log/nginx/access.log path;
    error_log /var/log/nginx/error.log;

    # --- Gzip compression for text-based responses ---

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/vnd.apple.mpegurl
        application/dash+xml
        application/xml
        text/plain
        text/css
        text/javascript
        application/javascript
        image/svg+xml;

    # --- Shared proxy headers (inherited by locations that set none of their own) ---

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Http_Host $http_host;
    proxy_set_header Scheme $scheme;
    proxy_set_header SERVER_PORT $server_port;
    proxy_set_header REMOTE_ADDR $remote_addr;
    proxy_set_header Connection '';

    # --- Deny hidden files (except .well-known) ---

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Prometheus scrapes app:9501 on the application network; this public listener never serves metrics.
    location = /metrics {
        return 404;
    }

    # ============================================================
    # Streaming: HLS/DASH video segments
    # ============================================================

    location ~ ^/api/stream/.+\.m4s$ {
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 256k;
        proxy_pass http://upstream_backend_php;
    }

    location ~ ^/api/stream/.+/init\.mp4$ {
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 64k;
        proxy_pass http://upstream_backend_php;
    }

    location ~ ^/api/stream/.+\.(m3u8|mpd)$ {
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 2 4k;
        proxy_busy_buffers_size 4k;
        proxy_pass http://upstream_backend_php;
    }

    # ============================================================
    # Streaming: audio (music) with HTTP Range / seek support
    # ============================================================

    location ~ ^/api/stream/(track|media)$ {
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_pass http://upstream_backend_php;
    }

    # ============================================================
    # Images: binary file delivery
    # ============================================================

    location ~ ^/api/images/[^/]+/file$ {
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 64k;
        proxy_pass http://upstream_backend_php;
    }

    # ============================================================
    # Everything else: API JSON, SSE, WebSocket
    # ============================================================

    location = /api/ws {
        access_log /var/log/nginx/access.log websocket;
        # Nginx errors include the raw request/upstream URL and cannot redact its query.
        # Keep status and timing in the access log, including failed upstream connections.
        error_log /dev/null;

        limit_except GET POST HEAD OPTIONS PUT DELETE PATCH {
            deny all;
        }

        # Setting any proxy header here drops the server-level ones; repeat the forwarding headers.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://upstream_backend_php;
    }

    location / {
        limit_except GET POST HEAD OPTIONS PUT DELETE PATCH {
            deny all;
        }

        # Setting any proxy header here drops the server-level ones; repeat the forwarding headers.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_pass http://upstream_backend_php;
    }
}
