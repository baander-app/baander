;; Baander's transaction-mode PgBouncer. baander-pooler replaces each @NAME@
;; placeholder from its environment before PgBouncer starts.
[databases]
;; Web, ordinary workers, media jobs, console commands and migrations.
@DATABASE@ = host=@SERVER_HOST@ port=5432 dbname=@DATABASE@ pool_size=@APPLICATION_POOL_SIZE@
;; Worker leases, media authority checks and the scheduler, on server
;; connections the application pool cannot take.
@DATABASE@_control = host=@SERVER_HOST@ port=5432 dbname=@DATABASE@ pool_size=@CONTROL_POOL_SIZE@

[users]
;; Control traffic logs in as its own role because PgBouncer applies
;; query_wait_timeout per user, not per database, and only in whole seconds
;; there. A control query that cannot get a server connection fails after one
;; second, before the lease agent's 1.5-second deadline, instead of queueing
;; behind its own pool. Application clients keep the default two-minute wait.
@USER@_control = query_wait_timeout=1

[pgbouncer]
listen_addr = *
listen_port = 6432
unix_socket_dir =
pidfile =
logfile =
pool_mode = transaction
;; The auth file holds each role's SCRAM verifier, so PgBouncer can reuse a
;; client's proof for its own server login. No plain-text password and no
;; auth_query.
auth_type = scram-sha-256
auth_file = /etc/baander-pooler/credentials/userlist.txt
;; The development writer check reads SHOW CLIENTS and SHOW SERVERS.
admin_users = @USER@
max_client_conn = 500
;; Short-lived lease agent connections would otherwise log every second.
log_connections = 0
log_disconnections = 0
