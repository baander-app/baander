# Rendered from the deployment size.
listen_addresses = '*'
port = 5432
# Clients reach PostgreSQL through the pooler: 20 application and 8 control
# server connections, 4 direct connections and 3 superuser slots.
max_connections = 35
superuser_reserved_connections = 3
reserved_connections = 0

shared_buffers = 256MB
effective_cache_size = 1024MB
work_mem = 16MB
maintenance_work_mem = 128MB
autovacuum_work_mem = 64MB
max_parallel_workers_per_gather = 0
autovacuum = on

shared_preload_libraries = 'pg_stat_statements'

# The application computes days and instants in UTC; a migration sets the same database default.
timezone = 'UTC'

checkpoint_completion_target = 0.9
default_statistics_target = 100

pgroonga.enable_wal = on
pgroonga.max_wal_size = 100MB
